<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>النظام المحاسبي المؤسسي</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Inter:wght@600;700;800;900&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{fontFamily:{sans:['Cairo','Inter','sans-serif']}}}};</script>
<style>
html,body{font-family:'Cairo','Inter',sans-serif;overflow-x:hidden;max-width:100vw;background:#eef2f7;color:#0f172a}
.num{font-family:'Inter','Cairo',sans-serif;font-variant-numeric:tabular-nums;direction:ltr;display:inline-block}
.card{background:#fff;border:1px solid #dbe3ee;box-shadow:0 3px 10px -4px rgba(15,23,42,.08);border-radius:1rem}
.inp{padding:.5rem .75rem;border-radius:.75rem;border:1px solid #cbd5e1;background:#fff;font-size:.875rem;outline:none}
.inp:focus{border-color:#1d4ed8}
.btn{padding:.4rem .75rem;border-radius:.6rem;font-size:.75rem;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:.25rem}
.b-bl{background:#1d4ed8;color:#fff}.b-dk{background:#0f172a;color:#fff}.b-gn{background:#047857;color:#fff}.b-tl{background:#0f766e;color:#fff}.b-am{background:#d97706;color:#fff}.b-rd{background:#be123c;color:#fff}.b-sk{background:#0284c7;color:#fff}.b-cy{background:#155e75;color:#fff}.b-in{background:#4338ca;color:#fff}.b-vi{background:#6d28d9;color:#fff}.b-lt{background:#f1f5f9;color:#334155}.b-rs{background:#fff1f2;color:#be123c}
#doc-stage{display:flex;align-items:center;justify-content:center;overflow:hidden;width:100%;flex:1;min-height:0}
#doc-wrap{position:relative;display:flex;justify-content:center;align-items:flex-start}
#print-area{width:560px;transform-origin:top center;flex-shrink:0}
@page{size:A4 portrait;margin:8mm}
@media print{
  #app,#mnav,#sb-bg,#toasts,#login-screen,.no-print{display:none!important}
  #modal,#doc-shell,#doc-stage,#doc-wrap{position:static!important;display:block!important;width:100%!important;height:auto!important;padding:0!important;margin:0!important;background:#fff!important;overflow:visible!important}
  #print-area{width:100%!important;transform:none!important;box-shadow:none!important;border:none!important;border-radius:0!important}
}
</style>
</head>
<body class="bg-[#eef2f7] text-slate-900 antialiased">
<div id="login-screen" class="fixed inset-0 z-[70] bg-gradient-to-br from-[#0b1222] via-slate-900 to-blue-950 flex items-center justify-center p-4 overflow-y-auto hidden"></div>
<div id="sb-bg" onclick="sb(0)" class="fixed inset-0 bg-slate-950/60 z-40 hidden lg:hidden"></div>
<div id="app" class="min-h-screen flex w-full max-w-full overflow-x-hidden">
  <aside id="sb" class="fixed lg:sticky top-0 right-0 z-50 h-screen w-64 bg-[#0b1222] text-slate-200 flex flex-col transition-transform duration-200 translate-x-full lg:translate-x-0 shrink-0 border-l border-slate-800">
    <div class="p-4 border-b border-slate-800 flex items-center justify-between gap-2 bg-gradient-to-l from-blue-950/60 to-transparent">
      <div class="flex items-center gap-2.5 min-w-0">
        <div id="sb-logo" class="w-10 h-10 rounded-xl bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center text-white font-black shrink-0 overflow-hidden">ERP</div>
        <div class="min-w-0"><h1 id="sb-name" class="text-sm font-extrabold text-white truncate">النظام المحاسبي</h1><p id="sb-sub" class="text-[10px] text-blue-300 truncate num">Enterprise ERP</p></div>
      </div>
      <button onclick="sb(0)" class="lg:hidden p-1.5 rounded-lg text-slate-400">×</button>
    </div>
    <div id="sb-user" class="px-3.5 py-2.5 border-b border-slate-800/80 bg-slate-900/60 flex items-center justify-between gap-2"></div>
    <nav id="sb-nav" class="flex-1 p-3 space-y-1 overflow-y-auto text-sm"></nav>
    <div class="p-3.5 border-t border-slate-800 text-[11px] text-slate-400 flex justify-between"><span class="num">ERP v6.2</span><span class="text-emerald-400 font-bold">● رقابة نشطة</span></div>
  </aside>
  <div class="flex-1 flex flex-col min-w-0 w-full">
    <header class="sticky top-0 z-30 bg-white/95 backdrop-blur border-b border-slate-200 px-3 sm:px-6 py-2.5 flex items-center justify-between gap-2">
      <div class="flex items-center gap-2.5 min-w-0">
        <button onclick="sb(1)" class="lg:hidden p-2 rounded-xl bg-slate-100 text-slate-700 font-bold">≡</button>
        <div class="min-w-0"><h2 id="pg-title" class="text-base sm:text-lg font-extrabold text-slate-900 truncate">لوحة التحكم</h2><p id="pg-sub" class="text-[11px] text-slate-500 truncate"></p></div>
      </div>
      <div class="flex items-center gap-1.5 sm:gap-2 shrink-0">
        <button onclick="openNotifModal()" class="relative px-2.5 py-2 rounded-xl border border-slate-200 bg-slate-50 text-slate-700 text-xs font-black cursor-pointer" title="الإشعارات"><span>تنبيه</span><span id="notif-badge" class="hidden absolute -top-1 -left-1 min-w-[18px] h-[18px] px-1 rounded-full bg-rose-600 text-white text-[10px] font-black flex items-center justify-center num">0</span></button>
        <button onclick="openOrdModal()" class="btn b-bl py-2 px-3">+ طلبية</button>
        <button onclick="logout()" class="px-2.5 py-2 rounded-xl border border-slate-200 bg-slate-50 text-rose-700 text-xs font-bold cursor-pointer">خروج</button>
      </div>
    </header>
    <main id="main" class="flex-1 p-3.5 sm:p-6 pb-24 lg:pb-8 max-w-7xl w-full mx-auto space-y-4"></main>
  </div>
</div>
<nav id="mnav" class="lg:hidden fixed bottom-0 inset-x-0 z-30 bg-white/95 backdrop-blur border-t border-slate-200 px-1 py-1.5 flex justify-around text-[11px] font-bold shadow-[0_-4px_14px_rgba(0,0,0,.08)]"></nav>
<div id="modal" class="fixed inset-0 z-50 hidden items-start sm:items-center justify-center p-2.5 sm:p-4 pt-4 bg-slate-950/70 overflow-y-auto"></div>
<div id="toasts" class="fixed bottom-20 lg:bottom-5 left-4 z-[80] flex flex-col gap-2 max-w-xs w-[calc(100%-2rem)] pointer-events-none"></div>
<script>
const KEY='erp_corp_v5',SKEY='erp_active_uid',
DEF_ADMIN=()=>({id:'u_admin',name:'المدير العام',title:'مدير النظام',role:'admin',pin:'1234',active:true,perms:{del:true,set:true,fin:true},ts:Date.now()}),
DEF={s:{name:'',nameEn:'',sub:'',logo:'',cur:'$',phone:'',addr:'',bank:'',iban:'',ordP:'ORD-',invP:'INV-',rvP:'RV-',purP:'PUR-',pvP:'PV-',foot:'شكراً لتعاملكم معنا - Thank you for your business',nOrd:1001,nInv:2026001,nRv:1001,nPur:3001,nPv:2001},cust:[],sup:[],prod:[],ord:[],invs:[],pay:[],pur:[],spay:[],exp:[],users:[DEF_ADMIN()],logs:[]},
CATS=['إيجار','رواتب وأجور','كهرباء ومياه','شحن ونقل','صيانة','مشتريات ونثريات','أخرى'],
PAYM=['كاش','ويش ماني','بطاقة بنك','عملة رقمية'],
NAV=[['dashboard','لوحة التحكم','●','bg-blue-600'],['orders','الطلبيات والفواتير','■','bg-blue-600'],['customers','الزبائن','◆','bg-sky-600'],['debts','ديون الزبائن والقبض','◈','bg-emerald-600'],['suppliers','التجار والمشتريات','⇄','bg-amber-600'],['warehouse','المستودع','▣','bg-teal-600'],['expenses','المصاريف','◷','bg-rose-600'],['staff','الإدارة والموظفين','★','bg-indigo-600'],['settings','إعدادات الشركة','☼','bg-slate-700']],
LOG_CATS={ord:['طلبيات','bg-blue-100 text-blue-800'],inv:['فواتير','bg-indigo-100 text-indigo-800'],pay:['قبض ودفع','bg-emerald-100 text-emerald-800'],wh:['مستودع ومشتريات','bg-teal-100 text-teal-800'],exp:['مصاريف','bg-rose-100 text-rose-800'],crm:['زبائن وتجار','bg-sky-100 text-sky-800'],sys:['إدارة ونظام','bg-slate-200 text-slate-800']};

let D=load(),curUser=null,view='dashboard',selC=null,tabC='inv',selS=null,tabS='pur',tabOrd='ord',tabWh='items',tabStaff='emp',draft=[],pickQ='',pickMode='ord',selOrds=new Set(),curWA=null,
F={oq:'',os:'all',cq:'',cd:'all',sq:'',sd:'all',wq:'',ws:'all',lq:'',lu:'all',lc:'all'};

function clone(o){return JSON.parse(JSON.stringify(o));}
function load(){
  try{
    const r=localStorage.getItem(KEY)||localStorage.getItem('erp_corp_v4')||localStorage.getItem('erp_corp_v3');
    if(!r)return clone(DEF);
    const p=JSON.parse(r),o=clone(DEF);
    if(p.s)o.s={...o.s,...p.s};
    o.cust=p.cust||[];o.sup=p.sup||[];o.prod=p.prod||[];o.ord=p.ord||p.inv||[];o.invs=p.invs||[];o.pay=p.pay||[];o.pur=p.pur||[];o.spay=p.spay||[];o.exp=p.exp||[];
    o.users=(p.users&&p.users.length)?p.users:[DEF_ADMIN()];
    if(!o.users.some(u=>u.role==='admin'&&u.active))o.users.unshift(DEF_ADMIN());
    o.logs=p.logs||[];
    o.ord.forEach(ord=>{
      if(ord.multiInvId&&!ord.invId)ord.invId=ord.multiInvId;
      if(ord.invNum&&!ord.invId){
        let ex=o.invs.find(v=>v.invNum===ord.invNum);
        if(!ex){ex={id:'inv_mig_'+ord.id,invNum:ord.invNum,date:ord.date,cid:ord.cid||null,cname:ord.cname||'زبون نقدي',cph:ord.cph||'',caddr:'',ordIds:[ord.id],ordNums:[ord.num],items:(ord.items||[]).map(x=>({...x,ordNum:ord.num,ordDate:ord.date})),total:Number(ord.total)||0,paid:Number(ord.paid)||0,rem:Number(ord.rem)||0,st:ord.st||'unpaid',pm:ord.pm||'',note:ord.note||'',by:ord.by||'',byId:ord.byId||'',ts:ord.ts||Date.now()};o.invs.push(ex);}
        ord.invId=ex.id;
      }
    });
    return o;
  }catch{return clone(DEF);}
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(D));}catch{toast('تعذر الحفظ المحلي','err');}}
const $=id=>document.getElementById(id),
uid=(p='id')=>p+'_'+Date.now()+'_'+Math.random().toString(36).slice(2,6),
today=()=>{const n=new Date();return new Date(n-n.getTimezoneOffset()*60000).toISOString().slice(0,10);},
nowTime=()=>{const n=new Date();return String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');},
esc=s=>s==null?'':String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'),
rn=n=>Math.round((Number(n)||0)*100)/100,
nf=n=>new Intl.NumberFormat('en-US',{maximumFractionDigits:2}).format(Number(n)||0),
cf=n=>`<span class="num">${nf(n)}</span>${D.s.cur?` <span class="text-[.82em] opacity-80">${esc(D.s.cur)}</span>`:''}`,
cfp=n=>D.s.cur?`${nf(n)} ${D.s.cur}`:nf(n),
bName=()=>D.s.name.trim()||'النظام المحاسبي المؤسسي',
bEn=()=>D.s.nameEn.trim()||'ENTERPRISE ERP',
byId=(arr,id)=>arr.find(x=>x.id===id)||null,
isAdmin=()=>curUser&&curUser.role==='admin',
can=p=>isAdmin()||!!(curUser?.perms?.[p]),
who=()=>({by:curUser?curUser.name:'المدير العام',byId:curUser?curUser.id:'u_admin'}),
byBadge=n=>n?`<span class="inline-flex items-center px-1.5 py-0.5 rounded bg-slate-100 border border-slate-200 text-slate-700 text-[10px] font-bold">• ${esc(n)}</span>`:'',
itemChips=items=>!(items&&items.length)?'':`<div class="flex flex-wrap gap-1 mt-1.5">${items.map(x=>`<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-lg bg-slate-100 border border-slate-200 text-[11px] text-slate-700"><strong class="text-slate-900">${esc(x.name)}</strong><span class="text-slate-400">|</span><span>العدد: <strong class="num text-blue-800">${nf(x.qty)}</strong></span><span class="text-slate-400">×</span><span>السعر: <strong class="num text-slate-800">${nf(x.pr)}</strong></span><span class="text-slate-400">=</span><strong class="num text-emerald-700">${nf(x.tot!=null?x.tot:rn((Number(x.qty)||0)*(Number(x.pr)||0)))}</strong></span>`).join('')}</div>`;

function logAct(cat,act,det,ref=''){
  const u=curUser||D.users[0]||DEF_ADMIN();
  D.logs.unshift({id:uid('lg'),ts:Date.now(),dt:today(),tm:nowTime(),uid:u.id,uname:u.name,urole:u.role==='admin'?'مدير':(u.title||'موظف'),cat,act,det,ref,read:false});
  if(D.logs.length>500)D.logs.length=500;
  save();updNotifBadge();
}
function updNotifBadge(){const b=$('notif-badge');if(!b)return;const cnt=D.logs.filter(l=>!l.read).length;b.textContent=cnt>99?'99+':cnt;b.classList.toggle('hidden',cnt===0);}
function showLogin(){
  const sc=$('login-screen'),au=D.users.filter(u=>u.active),da=au.find(u=>u.id==='u_admin'&&u.pin==='1234');
  sc.classList.remove('hidden');
  sc.innerHTML=`<div class="w-full max-w-md bg-white rounded-3xl shadow-2xl border overflow-hidden my-auto">
    <div class="p-6 bg-gradient-to-l from-[#0b1222] via-blue-950 to-blue-900 text-white text-center space-y-2">
      <div class="w-14 h-14 mx-auto rounded-2xl bg-white/10 border border-white/20 flex items-center justify-center font-black text-lg overflow-hidden">${D.s.logo?`<img src="${D.s.logo}" class="w-full h-full object-contain bg-white p-1"/>`:'ERP'}</div>
      <h1 class="text-lg font-black">${esc(bName())}</h1><p class="text-xs text-blue-200">تسجيل دخول الموظفين والإدارة</p>
    </div>
    <form onsubmit="doLogin(event)" class="p-5 space-y-4">
      <div><label class="text-xs font-extrabold text-slate-600 block mb-1.5">اختر الموظف</label>
        <select id="lg-u" required class="inp w-full bg-slate-50 font-bold">${au.map(u=>`<option value="${u.id}">${esc(u.name)} - ${u.role==='admin'?'مدير النظام':esc(u.title||'موظف')}</option>`).join('')}</select></div>
      <div><label class="text-xs font-extrabold text-slate-600 block mb-1.5">رمز الدخول (PIN)</label>
        <input id="lg-p" type="password" inputmode="numeric" required autocomplete="off" placeholder="أدخل الرمز السري..." class="inp w-full bg-slate-50 text-center text-lg font-black tracking-widest num"/></div>
      ${da?'<div class="text-[11px] text-center bg-blue-50 text-blue-800 border border-blue-200 rounded-xl p-2 font-bold">الرمز الافتراضي للمدير العام هو <span class="num font-black">1234</span></div>':''}
      <button class="w-full py-3 rounded-xl bg-blue-700 text-white font-extrabold text-sm cursor-pointer">دخول إلى النظام</button>
    </form></div>`;
  setTimeout(()=>$('lg-p')?.focus(),50);
}
function doLogin(e){
  e.preventDefault();
  const id=$('lg-u').value,pin=$('lg-p').value.trim(),u=D.users.find(x=>x.id===id&&x.active);
  if(!u){toast('الموظف غير متاح','err');return;}
  if(String(u.pin)!==pin){toast('رمز الدخول غير صحيح','err');$('lg-p').value='';$('lg-p').focus();return;}
  curUser=u;try{localStorage.setItem(SKEY,u.id);}catch{}
  $('login-screen').classList.add('hidden');
  logAct('sys','تسجيل دخول',`دخل ${u.name} (${u.role==='admin'?'مدير':u.title||'موظف'})`);
  go('dashboard');toast(`مرحباً ${u.name}`);
}
function logout(){
  if(curUser)logAct('sys','تسجيل خروج',`خرج ${curUser.name}`);
  curUser=null;try{localStorage.removeItem(SKEY);}catch{}
  closeM();sb(0);showLogin();
}
function openNotifModal(){
  const list=D.logs.slice(0,40),unread=D.logs.filter(l=>!l.read).length;
  modal(`<div class="p-4 border-b flex items-center justify-between bg-[#0b1222] text-white">
    <div><h3 class="font-extrabold text-sm">الإشعارات وسجل الحركات</h3><p class="text-[11px] text-blue-300">غير مقروء: <span class="num font-black">${unread}</span> • الإجمالي: <span class="num">${D.logs.length}</span></p></div>
    <div class="flex gap-1.5">${unread?'<button onclick="markAllRead(1)" class="btn b-gn text-[11px]">تحديد كمقروء</button>':''}<button onclick="closeM()" class="btn bg-slate-800 text-white">×</button></div>
  </div>
  <div class="max-h-[65vh] overflow-y-auto divide-y">${!list.length?'<div class="p-10 text-center text-slate-400 text-xs">لا توجد حركات بعد</div>':list.map(l=>{
    const[clb,ccl]=LOG_CATS[l.cat]||LOG_CATS.sys;
    return `<div onclick="markOneRead('${l.id}')" class="p-3.5 cursor-pointer ${l.read?'bg-white':'bg-blue-50/70 border-r-4 border-blue-600'}">
      <div class="flex items-center gap-1.5 flex-wrap">${!l.read?'<span class="w-2 h-2 rounded-full bg-rose-600"></span>':''}<span class="px-1.5 py-0.5 rounded text-[10px] font-extrabold ${ccl}">${clb}</span><span class="font-extrabold text-xs">${esc(l.act)}</span>${l.ref?`<span class="num text-[10px] font-black text-blue-800 bg-blue-100 px-1.5 rounded">${esc(l.ref)}</span>`:''}</div>
      <div class="text-xs text-slate-600 mt-1">${esc(l.det)}</div>
      <div class="text-[10px] text-slate-400 mt-1 flex gap-2"><span class="font-bold text-slate-700">${esc(l.uname)} (${esc(l.urole)})</span><span class="num">${esc(l.dt)} • ${esc(l.tm)}</span></div>
    </div>`;}).join('')}</div>
  <div class="p-3 border-t bg-slate-50 flex justify-between">${isAdmin()?"<button onclick=\"closeM();tabStaff='logs';go('staff')\" class=\"btn b-in\">سجل الرقابة الكامل ←</button>":'<span></span>'}<button onclick="closeM()" class="btn b-lt">إغلاق</button></div>`,'max-w-xl');
}
function markOneRead(id){const l=byId(D.logs,id);if(l&&!l.read){l.read=true;save();updNotifBadge();openNotifModal();}}
function markAllRead(m=0){D.logs.forEach(l=>l.read=true);save();updNotifBadge();if(m)openNotifModal();else render();toast('تم تحديد الكل كمقروء');}

function waClean(ph){let d=String(ph||'').replace(/[^\d]/g,'');if(!d)return'';if(d.startsWith('00'))d=d.slice(2);else if(d.startsWith('09')&&d.length===10)d='963'+d.slice(1);return d;}
function openWA(ph,msg=''){const n=waClean(ph),t=msg?`?text=${encodeURIComponent(msg)}`:'';window.open(n?`https://wa.me/${n}${t}`:`https://wa.me/${t}`,'_blank');}
const waBtn=(ph,lbl='واتساب')=>`<button onclick="openWA('${esc(ph||'')}')" class="btn b-gn">${lbl||'واتساب'}</button>`;

function cStats(id){
  const c=byId(D.cust,id);if(!c)return{cnt:0,invCnt:0,sales:0,paid:0,bal:0};
  const op=Number(c.open)||0,ords=D.ord.filter(o=>o.cid===id),invs=D.invs.filter(v=>v.cid===id),pays=D.pay.filter(p=>p.cid===id);
  const sales=rn(ords.reduce((a,o)=>a+(Number(o.total)||0),0)),paid=rn(ords.reduce((a,o)=>a+(Number(o.paid)||0),0)+pays.reduce((a,p)=>a+(Number(p.amt)||0),0));
  return{cnt:ords.length,invCnt:invs.length,sales,paid,bal:rn(op+sales-paid)};
}
function cLedger(id){
  const c=byId(D.cust,id);if(!c)return[];
  const L=[],op=Number(c.open)||0,invIds=new Set();
  if(op)L.push({dt:'-',k:0,ref:'رصيد سابق',desc:'رصيد افتتاحي مرحّل',d:op>0?op:0,c:op<0?-op:0});
  D.invs.filter(v=>v.cid===id).forEach(v=>{
    (v.ordIds||[]).forEach(x=>invIds.add(x));
    L.push({dt:v.date,k:v.ts||0,ref:v.invNum,desc:`فاتورة ${v.invNum}${(v.ordNums||[]).length?' ('+v.ordNums.join('، ')+')':''}`,d:Number(v.total)||0,c:0});
    if((Number(v.paid)||0)>0)L.push({dt:v.date,k:(v.ts||0)+1,ref:v.invNum,desc:`دفعة مع الفاتورة ${v.invNum}${v.pm?' ('+v.pm+')':''}`,d:0,c:Number(v.paid)||0});
  });
  D.ord.filter(o=>o.cid===id&&!invIds.has(o.id)).forEach(o=>{
    L.push({dt:o.date,k:o.ts||0,ref:o.num,desc:`طلبية ${o.num} - ${(o.items||[]).map(x=>x.name+' ×'+nf(x.qty)).join('، ')}`,d:Number(o.total)||0,c:0});
    if((Number(o.paid)||0)>0)L.push({dt:o.date,k:(o.ts||0)+1,ref:o.num,desc:`دفعة (${o.pm||'كاش'}) مع ${o.num}`,d:0,c:Number(o.paid)||0});
  });

  L.sort((a,b)=>a.k-b.k);let r=0;return L.map(x=>{r=rn(r+x.d-x.c);return{...x,r};});
}
function sStats(id){
  const s=byId(D.sup,id);if(!s)return{cnt:0,tot:0,paid:0,bal:0};

function sLedger(id){

  D.spay.filter(p=>p.sid===id).forEach(p=>L.push({dt:p.date,k:p.ts||0,ref:p.num||'PV',desc:`إيصال دفع ${p.num||''} (${p.m||'كاش'})${p.note?' - '+p.note:''}`,cr:0,dr:Number(p.amt)||0}));

function dashStats(){
  const sales=rn(D.ord.reduce((a,o)=>a+(Number(o.total)||0),0)),coll=rn(D.ord.reduce((a,o)=>a+(Number(o.paid)||0),0)+D.pay.reduce((a,p)=>a+(Number(p.amt)||0),0)),
  totPur=rn(D.pur.filter(p=>p.sid).reduce((a,p)=>a+(Number(p.total)||0),0)),paidSup=rn(D.spay.reduce((a,p)=>a+(Number(p.amt)||0),0)),exp=rn(D.exp.reduce((a,e)=>a+(Number(e.amt)||0),0));
  let gp=0;D.ord.forEach(o=>{gp+=(Number(o.total)||0)-(o.items||[]).reduce((a,x)=>a+(Number(x.cost)||0)*(Number(x.qty)||0),0);});
  const debtors=D.cust.map(c=>({...c,...cStats(c.id)})).filter(x=>x.bal>0).sort((a,b)=>b.bal-a.bal),
  creditors=D.sup.map(s=>({...s,...sStats(s.id)})).filter(x=>x.bal>0).sort((a,b)=>b.bal-a.bal),
  wCost=rn(D.prod.reduce((a,p)=>a+Math.max(0,Number(p.qty)||0)*(Number(p.cost)||0),0)),
  wSell=rn(D.prod.reduce((a,p)=>a+Math.max(0,Number(p.qty)||0)*(Number(p.sell)||0),0)),
  low=D.prod.filter(p=>(Number(p.qty)||0)<=(Number(p.min)||0));
  return{sales,coll,totPur,paidSup,exp,profit:rn(gp-exp),cash:rn(coll-exp-paidSup),debtors,debts:rn(debtors.reduce((a,x)=>a+x.bal,0)),creditors,payables:rn(creditors.reduce((a,x)=>a+x.bal,0)),wCost,wSell,low};

function fitDoc(){const st=$('doc-stage'),sh=$('print-area'),wr=$('doc-wrap');if(!st||!sh||!wr)return;sh.style.transform='none';wr.style.width='auto';wr.style.height='auto';const aw=Math.max(180,st.clientWidth-14),ah=Math.max(180,st.clientHeight-14),nw=sh.offsetWidth,nh=sh.offsetHeight;if(!nw||!nh)return;const sc=Math.min(1.12,aw/nw,ah/nh);sh.style.transform=`scale(${sc})`;wr.style.width=Math.ceil(nw*sc)+'px';wr.style.height=Math.ceil(nh*sc)+'px';}

function rPicker(mode){
  const el=$('picker-list');if(!el)return;
  const q=pickQ.trim().toLowerCase(),list=D.prod.filter(p=>!q||(p.name||'').toLowerCase().includes(q));
  if($('pick-cnt'))$('pick-cnt').textContent=draft.length;
  el.innerHTML=!list.length?'<div class="col-span-full text-center text-xs text-slate-400 py-3">لا توجد أصناف</div>':list.map(p=>{
    const stk=Number(p.qty)||0,dis=mode==='ord'&&stk<=0,ex=draft.find(r=>r.pid===p.id),pr=mode==='ord'?p.sell:p.cost;
    return `<button type="button" ${dis?'disabled':`onclick="pickItem('${p.id}','${mode}')"`} class="text-right p-2 rounded-xl border relative cursor-pointer ${dis?'bg-slate-100 opacity-50':ex?'bg-blue-50 border-blue-500':'bg-white border-slate-200'}"><div class="font-bold text-xs truncate pl-6">${esc(p.name)}</div><div class="flex justify-between text-[10px] mt-0.5"><span class="font-bold ${stk>0?'text-teal-700':'text-rose-600'}">متوفر: <span class="num">${nf(stk)}</span></span><span class="font-black text-blue-800">السعر: <span class="num">${nf(pr)}</span></span></div><span id="pbadge-${p.id}" class="absolute top-1.5 left-1.5 text-[10px] font-black px-1.5 rounded-full num ${ex?'bg-blue-700 text-white':'hidden'}">${ex?'✓ '+nf(ex.qty):''}</span></button>`;
  }).join('');
}
function pickItem(pid,mode){
  const p=byId(D.prod,pid);if(!p)return;const stk=Number(p.qty)||0,ex=draft.find(r=>r.pid===pid);
  if(ex){if(mode==='ord'&&ex.qty+1>stk){toast(`المتوفر ${nf(stk)} فقط`,'warn');return;}ex.qty=rn(ex.qty+1);}
  else{if(mode==='ord'&&stk<=0){toast('الصنف نافذ','err');return;}draft.push({rid:uid('r'),pid:p.id,qty:1,pr:Number(mode==='ord'?p.sell:p.cost)||0});}
  rPicker(mode);rRows(mode);mode==='ord'?calcOrd():calcPur();
}
function stepQty(rid,d,mode){
  const r=draft.find(x=>x.rid===rid);if(!r)return;const p=byId(D.prod,r.pid),stk=p?Number(p.qty)||0:0,nq=rn(r.qty+d);
  if(nq<=0){draft=draft.filter(x=>x.rid!==rid);rPicker(mode);rRows(mode);mode==='ord'?calcOrd():calcPur();return;}
  if(mode==='ord'&&nq>stk){toast(`المتوفر ${nf(stk)} فقط`,'warn');return;}
  r.qty=nq;if($('qi-'+rid))$('qi-'+rid).value=r.qty;updRowVisual(r,mode);mode==='ord'?calcOrd():calcPur();
}
function rRows(mode){
  const el=$('rows');if(!el)return;if($('pick-cnt'))$('pick-cnt').textContent=draft.length;
  const prLbl=mode==='ord'?'سعر البيع':'سعر التكلفة';
  el.innerHTML=!draft.length?'<div class="p-4 rounded-xl border border-dashed text-center text-xs text-slate-400">اضغط على الأصناف أعلاه لإضافتها</div>':draft.map(r=>{
    const p=byId(D.prod,r.pid),stk=p?Number(p.qty)||0:0,over=mode==='ord'&&r.qty>stk;
    return `<div id="row-${r.rid}" class="bg-slate-50 p-2.5 rounded-xl border space-y-2 ${over?'border-rose-400 bg-rose-50':'border-slate-200'}">
      <div class="flex items-center justify-between gap-2">
        <div class="min-w-0"><div class="font-extrabold text-xs truncate">${esc(p?p.name:'صنف')}</div><div id="st-${r.rid}" class="text-[10px] font-bold ${over?'text-rose-600':'text-teal-700'}">${mode==='ord'?(over?`! أكبر من المتوفر (${nf(stk)})`:`المتوفر بالمستودع: ${nf(stk)}`):`الرصيد الحالي: ${nf(stk)}`}</div></div>
        <button type="button" onclick="draft=draft.filter(x=>x.rid!=='${r.rid}');rPicker('${mode}');rRows('${mode}');${mode==='ord'?'calcOrd()':'calcPur()'}" class="px-2 py-0.5 rounded-lg bg-rose-50 text-rose-600 text-xs font-bold cursor-pointer">حذف ×</button>
      </div>
      <div class="grid grid-cols-12 gap-2 items-end">
        <div class="col-span-5">
          <label class="text-[10px] font-bold text-slate-500 block mb-1">العدد / الكمية</label>
          <div class="flex items-center gap-1"><button type="button" onclick="stepQty('${r.rid}',-1,'${mode}')" class="w-7 h-7 rounded-lg bg-slate-200 font-black cursor-pointer shrink-0">-</button><input id="qi-${r.rid}" type="number" min="0.01" step="any" value="${r.qty}" oninput="updRow('${r.rid}','qty',this.value,'${mode}')" class="w-full px-1 py-1 rounded-lg border bg-white text-xs text-center font-bold num"/><button type="button" onclick="stepQty('${r.rid}',1,'${mode}')" class="w-7 h-7 rounded-lg bg-blue-100 text-blue-800 font-black cursor-pointer shrink-0">+</button></div>
        </div>
        <div class="col-span-4">
          <label class="text-[10px] font-bold text-slate-500 block mb-1">${prLbl}</label>
          <input id="pi-${r.rid}" type="number" min="0" step="any" value="${r.pr}" oninput="updRow('${r.rid}','pr',this.value,'${mode}')" class="w-full px-1.5 py-1 rounded-lg border bg-white text-xs text-center font-bold num"/>
        </div>
        <div class="col-span-3 text-center">
          <label class="text-[10px] font-bold text-slate-500 block mb-1">الإجمالي</label>
          <div id="lt-${r.rid}" class="py-1 px-1.5 rounded-lg bg-white border border-slate-200 text-xs font-black text-blue-900 num">${nf(r.qty*r.pr)}</div>
        </div>
      </div>
    </div>`;
  }).join('');
}
function updRowVisual(r,mode){
  const p=byId(D.prod,r.pid),stk=p?Number(p.qty)||0:0,over=mode==='ord'&&r.qty>stk;
  if($('lt-'+r.rid))$('lt-'+r.rid).textContent=nf(r.qty*r.pr);
  if($('st-'+r.rid)){$('st-'+r.rid).className=`text-[10px] font-bold ${over?'text-rose-600':'text-teal-700'}`;$('st-'+r.rid).textContent=mode==='ord'?(over?`! أكبر من المتوفر (${nf(stk)})`:`المتوفر بالمستودع: ${nf(stk)}`):`الرصيد الحالي: ${nf(stk)}`;}
  if($('pbadge-'+r.pid)){$('pbadge-'+r.pid).textContent='✓ '+nf(r.qty);$('pbadge-'+r.pid).classList.remove('hidden');}
}
function updRow(rid,k,v,mode){const r=draft.find(x=>x.rid===rid);if(!r)return;r[k]=Number(v)||0;updRowVisual(r,mode);mode==='ord'?calcOrd():calcPur();}
function calcOrd(man=0){
  const tot=rn(draft.reduce((a,r)=>a+r.qty*r.pr,0)),st=$('ost'),pe=$('opd');if(!st||!pe)return;
  if(!$('oc').value&&st.value!=='paid'){toast('الدين يتطلب اختيار زبون','warn');st.value='paid';}
  let pd=Number(pe.value)||0;
  if(!man){pd=st.value==='paid'?tot:st.value==='unpaid'?0:(pd>=tot?0:pd);pe.value=pd;pe.readOnly=(st.value!=='partial');}
  else{pd=Math.max(0,Math.min(tot,pd));st.value=pd>=tot&&tot>0?'paid':pd<=0&&tot>0?'unpaid':'partial';}
  $('pm-wrap').classList.toggle('hidden',st.value==='unpaid');$('pd-wrap').classList.toggle('opacity-50',!man&&st.value!=='partial');
  $('otot').innerHTML=cf(tot);$('ospd').innerHTML=cf(pd);$('orem').innerHTML=cf(rn(tot-pd));
}
function createInvFromOrders(chosen,date,note=''){
  const first=chosen[0],cid=first.cid||null,c=cid?byId(D.cust,cid):null,invNum=D.s.invP+D.s.nInv++,items=[];
  chosen.forEach(o=>(o.items||[]).forEach(x=>items.push({...x,ordNum:o.num,ordDate:o.date})));
  const tot=rn(chosen.reduce((a,o)=>a+(Number(o.total)||0),0)),pd=rn(chosen.reduce((a,o)=>a+(Number(o.paid)||0),0)),rm=rn(chosen.reduce((a,o)=>a+(Number(o.rem)||0),0)),pms=[...new Set(chosen.map(o=>o.pm).filter(Boolean))];
  const inv={id:uid('inv'),invNum,date:date||today(),cid,cname:c?c.name:(first.cname||'زبون نقدي'),cph:c?.phone||first.cph||'',caddr:c?.addr||'',ordIds:chosen.map(o=>o.id),ordNums:chosen.map(o=>o.num),items,total:tot,paid:pd,rem:rm,st:rm<=0?'paid':pd>0?'partial':'unpaid',pm:pms.length===1?pms[0]:'',note:note||(chosen.length===1?(first.note||''):''),...who(),ts:Date.now()};
  D.invs.push(inv);chosen.forEach(o=>{o.invId=inv.id;o.invNum=invNum;});
  logAct('inv','إصدار فاتورة',`فاتورة للزبون «${inv.cname}» بقيمة ${cfp(inv.total)}`,invNum);return inv;
}
function saveOrd(e){
  e.preventDefault();if(!draft.length){toast('اختر صنفاً واحداً على الأقل','err');return;}
  const cid=$('oc').value||null,dt=$('od').value||today(),stVal=$('ost').value,pm=stVal==='unpaid'?'':$('opm').value,req={},items=[];
  for(const r of draft){const p=byId(D.prod,r.pid);if(!p||r.qty<=0){toast('تحقق من الكميات','err');return;}req[p.id]=(req[p.id]||0)+r.qty;items.push({pid:p.id,name:p.name,qty:r.qty,pr:r.pr,cost:Number(p.cost)||0,tot:rn(r.qty*r.pr)});}
  for(const[pid,need]of Object.entries(req)){const p=byId(D.prod,pid);if(p&&(Number(p.qty)||0)<need){toast(`المتوفر من "${p.name}" هو ${nf(p.qty)} فقط`,'err');return;}}
  const tot=rn(items.reduce((a,x)=>a+x.tot,0)),pd=stVal==='paid'?tot:stVal==='unpaid'?0:Math.max(0,Math.min(tot,Number($('opd').value)||0)),rem=rn(tot-pd);
  if(rem>0&&!cid){toast('اختر زبوناً للطلبية الآجلة','err');return;}
  for(const[pid,need]of Object.entries(req)){const p=byId(D.prod,pid);if(p)p.qty=rn((Number(p.qty)||0)-need);}
  const c=cid?byId(D.cust,cid):null,num=D.s.ordP+D.s.nOrd++,auto=$('oauto').checked;
  const ord={id:uid('ord'),num,invId:null,invNum:null,date:dt,cid,cname:c?c.name:'زبون نقدي',cph:c?.phone||'',items,total:tot,paid:pd,rem,st:rem<=0?'paid':pd>0?'partial':'unpaid',pm,note:$('onote').value.trim(),...who(),ts:Date.now()};
  D.ord.push(ord);logAct('ord','إنشاء طلبية بيع',`طلبية «${ord.cname}» بقيمة ${cfp(tot)}`,num);
  let inv=auto?createInvFromOrders([ord],dt,ord.note):null;
  save();closeM();render();toast(inv?`تم الحفظ وإصدار الفاتورة ${inv.invNum}`:`تم حفظ الطلبية ${num}`);if(inv)prevInv(inv.id);

function saveProd(e,id){

function saveEmp(e,id){
  e.preventDefault();const name=$('enm').value.trim(),title=$('etit').value.trim()||'موظف',pin=$('epin').value.trim(),role=$('erole').value;if(!name||!pin)return;
  const perms=role==='admin'?{del:true,fin:true,set:true}:{del:$('ep-del').checked,fin:$('ep-fin').checked,set:$('ep-set').checked};
  if(id){const i=D.users.findIndex(x=>x.id===id);if(i>-1){if(D.users[i].role==='admin'&&role!=='admin'&&D.users.filter(x=>x.role==='admin'&&x.active).length<=1){toast('لا يمكن إلغاء المدير الوحيد','err');return;}D.users[i]={...D.users[i],name,title,pin,role,perms};if(curUser&&curUser.id===id)curUser=D.users[i];logAct('sys','تعديل موظف',name);}}
  else{D.users.push({id:uid('u'),name,title,pin,role,active:true,perms,ts:Date.now()});logAct('sys','إضافة موظف',name);}
  save();closeM();render();toast('تم الحفظ');
}

function delEmp(id){const u=byId(D.users,id);if(!u)return;if(u.role==='admin'&&D.users.filter(x=>x.role==='admin'&&x.active).length<=1){toast('لا يمكن حذف المدير الوحيد','err');return;}confirmM('حذف '+u.name,'سيُزال الموظف مع بقاء سجلاته السابقة.',()=>{D.users=D.users.filter(x=>x.id!==id);save();render();toast('تم الحذف');});}

    <input id="sadr" value="${esc(s.addr)}" placeholder="العنوان" class="inp w-full"/><input id="sft" value="${esc(s.foot)}" placeholder="تذييل الفواتير" class="inp w-full"/>
    <div class="flex justify-end"><button class="btn b-bl px-6 py-2.5">حفظ الإعدادات</button></div></form>
    <div class="space-y-3"><div class="card p-4 space-y-2.5"><h3 class="font-extrabold text-sm">النسخ الاحتياطي</h3><button onclick="expJSON()" class="btn b-dk w-full py-2.5">تصدير نسخة (JSON)</button><label class="btn b-lt w-full py-2.5 border">استيراد نسخة (JSON)<input type="file" accept=".json" onchange="impJSON(event)" class="hidden"/></label></div>
    <div class="card p-4 space-y-2.5"><h3 class="font-extrabold text-sm">التجربة وإعادة الضبط</h3><button onclick="loadSample()" class="btn bg-blue-50 text-blue-800 border w-full py-2.5">بيانات تجريبية</button><button onclick="confirmM('تصفير النظام','مسح جميع البيانات نهائياً؟',()=>{D=clone(DEF);save();logout();})" class="btn b-rs border w-full py-2.5">تصفير كافة البيانات</button></div></div></div>`;
}
function upLogo(e){const f=e.target.files?.[0];if(!f)return;const img=new Image(),rd=new FileReader();rd.onload=ev=>{img.onload=()=>{const cv=document.createElement('canvas'),m=160,sc=Math.min(1,m/Math.max(img.width,img.height));cv.width=img.width*sc;cv.height=img.height*sc;cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);D.s.logo=cv.toDataURL('image/png',0.85);save();render();toast('تم رفع الشعار');};img.src=ev.target.result;};rd.readAsDataURL(f);}
function saveSet(e){e.preventDefault();Object.assign(D.s,{name:$('snm').value.trim(),nameEn:$('sne').value.trim(),phone:$('sph').value.trim(),cur:$('scur').value.trim()||'$',bank:$('sbnk').value.trim(),iban:$('sibn').value.trim(),addr:$('sadr').value.trim(),foot:$('sft').value.trim()});logAct('sys','تحديث الإعدادات','تعديل هوية الشركة');save();render();toast('تم الحفظ');}
function expJSON(){const b=new Blob([JSON.stringify(D)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=`erp-${today()}.json`;a.click();URL.revokeObjectURL(u);toast('تم التصدير');}
function impJSON(e){const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=ev=>{try{localStorage.setItem(KEY,ev.target.result);D=load();render();toast('تم الاستيراد');}catch{toast('ملف غير صالح','err');}};r.readAsText(f);}
function loadSample(){
  if(!D.s.name)Object.assign(D.s,{name:'شركة الأفق العالمية للتجارة',nameEn:'HORIZON GLOBAL TRADING',cur:'$',phone:'0931742603',addr:'دمشق - المنطقة الصناعية',bank:'Commercial Bank',iban:'SY46 0010 0000 1984'});
  const w=who(),c1={id:uid('c'),name:'مجموعة الشرق للمقاولات',phone:'0933112233',addr:'دمشق',open:0,...w,ts:Date.now()-5e5},s1={id:uid('s'),name:'شركة النور للتوريدات',phone:'0944556677',addr:'المنطقة الصناعية',open:0,...w,ts:Date.now()-5e5},p1={id:uid('pr'),name:'طقم حمام كامل فاخر',cost:180,sell:250,qty:18,min:5,...w,ts:Date.now()-5e5},p2={id:uid('pr'),name:'مغسلة رخام مع خلاط',cost:75,sell:110,qty:28,min:8,...w,ts:Date.now()-4e5};
  D.cust.push(c1);D.sup.push(s1);D.prod.push(p1,p2);
  D.pur.push({id:uid('pur'),num:D.s.purP+D.s.nPur++,date:today(),sid:s1.id,sname:s1.name,items:[{pid:p1.id,name:p1.name,qty:20,pr:180,tot:3600},{pid:p2.id,name:p2.name,qty:30,pr:75,tot:2250}],total:5850,note:'توريد أول',...w,ts:Date.now()-3e5});
  D.ord.push({id:uid('ord'),num:D.s.ordP+D.s.nOrd++,invId:null,invNum:null,date:today(),cid:c1.id,cname:c1.name,cph:c1.phone,items:[{pid:p1.id,name:p1.name,qty:2,pr:250,cost:180,tot:500},{pid:p2.id,name:p2.name,qty:2,pr:110,cost:75,tot:220}],total:720,paid:300,rem:420,st:'partial',pm:'ويش ماني',note:'تسليم أول',...w,ts:Date.now()-2e5});
  D.pay.push({id:uid('rv'),num:D.s.rvP+D.s.nRv++,cid:c1.id,cname:c1.name,amt:220,date:today(),m:'كاش',note:'دفعة',...w,ts:Date.now()-1e5});
  logAct('sys','بيانات تجريبية','تم تحميل بيانات تجريبية');save();go('dashboard');toast('تم التحميل');
}

document.addEventListener('DOMContentLoaded',()=>{
  let savedUid=null;try{savedUid=localStorage.getItem(SKEY);}catch{}
  if(savedUid){const u=D.users.find(x=>x.id===savedUid&&x.active);if(u){curUser=u;go('dashboard');return;}}
  showLogin();
});
</script>
</body>

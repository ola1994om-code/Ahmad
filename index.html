<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>النظام المحاسبي المؤسسي</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Inter:wght@600;700;800;900&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{fontFamily:{sans:['Cairo','Inter','sans-serif']}}}};</script>
<style>
html,body{font-family:'Cairo','Inter',sans-serif;overflow-x:hidden;max-width:100vw;background:#eef2f7;color:#0f172a}
.num{font-family:'Inter','Cairo',sans-serif;font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
span.num,strong.num,b.num{display:inline-block}
.card{background:#fff;border:1px solid #dbe3ee;box-shadow:0 3px 10px -4px rgba(15,23,42,.08);border-radius:1rem}
.inp{padding:.5rem .75rem;border-radius:.75rem;border:1px solid #cbd5e1;background:#fff;font-size:.875rem;outline:none}
.inp:focus{border-color:#1d4ed8}
.btn{padding:.4rem .75rem;border-radius:.6rem;font-size:.75rem;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:.25rem}
.b-bl{background:#1d4ed8;color:#fff}.b-dk{background:#0f172a;color:#fff}.b-gn{background:#047857;color:#fff}.b-tl{background:#0f766e;color:#fff}.b-am{background:#d97706;color:#fff}.b-rd{background:#be123c;color:#fff}.b-sk{background:#0284c7;color:#fff}.b-cy{background:#155e75;color:#fff}.b-in{background:#4338ca;color:#fff}.b-vi{background:#6d28d9;color:#fff}.b-lt{background:#f1f5f9;color:#334155}.b-rs{background:#fff1f2;color:#be123c}
#doc-stage{display:flex;align-items:center;justify-content:center;overflow:hidden;width:100%;flex:1;min-height:0}
#doc-wrap{position:relative;display:flex;justify-content:center;align-items:flex-start}
#print-area{width:640px;transform-origin:top center;flex-shrink:0}
@page{size:A4 portrait;margin:8mm}
@media print{
  #app,#mnav,#sb-bg,#toasts,#login-screen,.no-print{display:none!important}
  #modal,#doc-shell,#doc-stage,#doc-wrap{position:static!important;display:block!important;width:100%!important;height:auto!important;padding:0!important;margin:0!important;background:#fff!important;overflow:visible!important}
  #print-area{width:100%!important;transform:none!important;box-shadow:none!important;border:none!important;border-radius:0!important}
}
</style>
</head>
<body class="bg-[#eef2f7] text-slate-900 antialiased">
<div id="login-screen" class="fixed inset-0 z-[70] bg-gradient-to-br from-[#0b1222] via-slate-900 to-blue-950 flex items-center justify-center p-4 overflow-y-auto hidden"></div>
<div id="sb-bg" onclick="sb(0)" class="fixed inset-0 bg-slate-950/60 z-40 hidden lg:hidden"></div>
<div id="app" class="min-h-screen flex w-full max-w-full overflow-x-hidden">
  <aside id="sb" class="fixed lg:sticky top-0 right-0 z-50 h-screen w-64 bg-[#0b1222] text-slate-200 flex flex-col transition-transform duration-200 translate-x-full lg:translate-x-0 shrink-0 border-l border-slate-800">
    <div class="p-4 border-b border-slate-800 flex items-center justify-between gap-2 bg-gradient-to-l from-blue-950/60 to-transparent">
      <div class="flex items-center gap-2.5 min-w-0">
        <div id="sb-logo" class="w-10 h-10 rounded-xl bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center text-white font-black shrink-0 overflow-hidden">ERP</div>
        <div class="min-w-0"><h1 id="sb-name" class="text-sm font-extrabold text-white truncate">النظام المحاسبي</h1><p id="sb-sub" class="text-[10px] text-blue-300 truncate num">Enterprise ERP</p></div>
      </div>
      <button onclick="sb(0)" class="lg:hidden p-1.5 rounded-lg text-slate-400">×</button>
    </div>
    <div id="sb-user" class="px-3.5 py-2.5 border-b border-slate-800/80 bg-slate-900/60 flex items-center justify-between gap-2"></div>
    <nav id="sb-nav" class="flex-1 p-3 space-y-1 overflow-y-auto text-sm"></nav>
    <div class="p-3.5 border-t border-slate-800 text-[11px] text-slate-400 flex justify-between"><span class="num">ERP v7.2</span><span class="text-emerald-400 font-bold">● رقابة نشطة</span></div>
  </aside>
  <div class="flex-1 flex flex-col min-w-0 w-full">
    <header class="sticky top-0 z-30 bg-white/95 backdrop-blur border-b border-slate-200 px-3 sm:px-6 py-2.5 flex items-center justify-between gap-2">
      <div class="flex items-center gap-2.5 min-w-0">
        <button onclick="sb(1)" class="lg:hidden p-2 rounded-xl bg-slate-100 text-slate-700 font-bold">≡</button>
        <div class="min-w-0"><h2 id="pg-title" class="text-base sm:text-lg font-extrabold text-slate-900 truncate">لوحة التحكم</h2><p id="pg-sub" class="text-[11px] text-slate-500 truncate"></p></div>
      </div>
      <div class="flex items-center gap-1.5 sm:gap-2 shrink-0">
        <button id="hdr-notif" onclick="go('notifications')" class="hidden relative px-2.5 py-2 rounded-xl border border-rose-200 bg-rose-50 text-rose-800 text-xs font-black cursor-pointer" title="قسم الإشعارات"><span>الإشعارات</span><span id="notif-badge" class="hidden absolute -top-1 -left-1 min-w-[18px] h-[18px] px-1 rounded-full bg-rose-600 text-white text-[10px] font-black flex items-center justify-center num">0</span></button>
        <button onclick="openOrdModal()" class="btn b-bl py-2 px-3">+ طلبية</button>
        <button onclick="logout()" class="px-2.5 py-2 rounded-xl border border-slate-200 bg-slate-50 text-rose-700 text-xs font-bold cursor-pointer">خروج</button>
      </div>
    </header>
    <main id="main" class="flex-1 p-3.5 sm:p-6 pb-24 lg:pb-8 max-w-7xl w-full mx-auto space-y-4"></main>
  </div>
</div>
<nav id="mnav" class="lg:hidden fixed bottom-0 inset-x-0 z-30 bg-white/95 backdrop-blur border-t border-slate-200 px-1 py-1.5 flex justify-around text-[11px] font-bold shadow-[0_-4px_14px_rgba(0,0,0,.08)]"></nav>
<div id="modal" class="fixed inset-0 z-50 hidden items-start sm:items-center justify-center p-2.5 sm:p-4 pt-4 bg-slate-950/70 overflow-y-auto"></div>
<div id="toasts" class="fixed bottom-20 lg:bottom-5 left-4 z-[80] flex flex-col gap-2 max-w-xs w-[calc(100%-2rem)] pointer-events-none"></div>
<script>
const KEY='erp_corp_v5',SKEY='erp_active_uid',
DEF_ADMIN=()=>({id:'u_admin',name:'المدير العام',title:'مدير النظام',role:'admin',pin:'1234',active:true,perms:{del:true,set:true,fin:true},ts:Date.now()}),
DEF={s:{name:'',nameEn:'',sub:'',logo:'',cur:'$',phone:'',addr:'',bank:'',iban:'',ordP:'ORD-',invP:'INV-',rvP:'RV-',purP:'PUR-',pvP:'PV-',dnP:'DB-',foot:'شكراً لتعاملكم معنا - Thank you for your business',nOrd:1001,nInv:2026001,nRv:1001,nPur:3001,nPv:2001,nDn:4001},cust:[],sup:[],prod:[],ord:[],invs:[],pay:[],pur:[],spay:[],exp:[],users:[DEF_ADMIN()],logs:[]},
CATS=['إيجار','رواتب وأجور','كهرباء ومياه','شحن ونقل','صيانة','مشتريات ونثريات','أخرى'],
PAYM=['كاش','ويش ماني','بطاقة بنك','عملة رقمية'],
SPAY_REASONS=['سداد سند دين بضاعة','دفعة جزئية من سند دين','تصفية سند دين بالكامل','شراء بضاعة نقدي','تسوية رصيد سابق للتاجر'],
NAV=[['dashboard','لوحة التحكم','●','bg-blue-600'],['orders','الطلبيات والفواتير','■','bg-blue-600'],['customers','الزبائن','◆','bg-sky-600'],['debts','ديون الزبائن والقبض','◈','bg-emerald-600'],['suppliers','التجار والمشتريات','⇄','bg-amber-600'],['warehouse','المستودع','▣','bg-teal-600'],['expenses','المصاريف','◷','bg-rose-600'],['notifications','قسم الإشعارات','◉','bg-rose-600'],['staff','الإدارة والموظفين','★','bg-indigo-600'],['settings','إعدادات الشركة','☼','bg-slate-700']],
LOG_CATS={ord:['طلبيات','bg-blue-100 text-blue-800'],inv:['فواتير','bg-indigo-100 text-indigo-800'],pay:['قبض ودفع','bg-emerald-100 text-emerald-800'],wh:['مستودع ومشتريات','bg-teal-100 text-teal-800'],exp:['مصاريف','bg-rose-100 text-rose-800'],crm:['زبائن وتجار','bg-sky-100 text-sky-800'],sys:['إدارة ونظام','bg-slate-200 text-slate-800']};

let D=load(),curUser=null,view='dashboard',selC=null,tabC='inv',selS=null,tabS='debts',tabSup='list',tabOrd='ord',tabWh='items',draft=[],pickQ='',pickMode='ord',selOrds=new Set(),curWA=null,
F={oq:'',os:'all',cq:'',cd:'all',sq:'',sd:'all',sdb:'open',wq:'',ws:'all',lq:'',lu:'all',lc:'all',lr:'all'};

function clone(o){return JSON.parse(JSON.stringify(o));}
function load(){
  try{
    const r=localStorage.getItem(KEY)||localStorage.getItem('erp_corp_v4')||localStorage.getItem('erp_corp_v3');
    if(!r)return clone(DEF);
    const p=JSON.parse(r),o=clone(DEF);
    if(p.s)o.s={...o.s,...p.s};
    o.cust=p.cust||[];o.sup=p.sup||[];o.prod=p.prod||[];o.ord=p.ord||p.inv||[];o.invs=p.invs||[];o.pay=p.pay||[];o.pur=p.pur||[];o.spay=p.spay||[];o.exp=p.exp||[];
    o.users=(p.users&&p.users.length)?p.users:[DEF_ADMIN()];
    if(!o.users.some(u=>u.role==='admin'&&u.active))o.users.unshift(DEF_ADMIN());
    o.logs=p.logs||[];
    o.prod.forEach(pr=>{if(pr.qtyLocked===undefined)pr.qtyLocked=(Number(pr.qty)||0)>0;});
    o.pur.forEach(pr=>{
      if(!pr.payType){
        const paidAmt=o.spay.filter(x=>x.purId===pr.id).reduce((a,x)=>a+(Number(x.amt)||0),0);
        if(paidAmt>=(Number(pr.total)||0)&&(Number(pr.total)||0)>0)pr.payType='cash';
        else if(paidAmt>0){pr.payType='partial';if(!pr.bondNum)pr.bondNum=(o.s.dnP||'DB-')+(o.s.nDn++);}
        else{pr.payType='debt';if(!pr.bondNum)pr.bondNum=(o.s.dnP||'DB-')+(o.s.nDn++);}
      }
    });
    o.ord.forEach(ord=>{
      if(ord.multiInvId&&!ord.invId)ord.invId=ord.multiInvId;
      if(ord.invNum&&!ord.invId){
        let ex=o.invs.find(v=>v.invNum===ord.invNum);
        if(!ex){ex={id:'inv_mig_'+ord.id,invNum:ord.invNum,date:ord.date,cid:ord.cid||null,cname:ord.cname||'زبون نقدي',cph:ord.cph||'',caddr:'',ordIds:[ord.id],ordNums:[ord.num],items:(ord.items||[]).map(x=>({...x,ordNum:ord.num,ordDate:ord.date})),total:Number(ord.total)||0,paid:Number(ord.paid)||0,rem:Number(ord.rem)||0,st:ord.st||'unpaid',pm:ord.pm||'',note:ord.note||'',by:ord.by||'',byId:ord.byId||'',ts:ord.ts||Date.now()};o.invs.push(ex);}
        ord.invId=ex.id;
      }
    });
    return o;
  }catch{return clone(DEF);}
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(D));}catch{toast('تعذر الحفظ المحلي','err');}}
const $=id=>document.getElementById(id),
uid=(p='id')=>p+'_'+Date.now()+'_'+Math.random().toString(36).slice(2,6),
today=()=>{const n=new Date();return new Date(n-n.getTimezoneOffset()*60000).toISOString().slice(0,10);},
fmtDate=d=>{if(!d||!/^\d{4}-\d{2}-\d{2}$/.test(d))return d||'';const[y,m,day]=d.split('-');return`${day}-${m}-${y}`;},
nowTime=()=>{const n=new Date();return String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');},
esc=s=>s==null?'':String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'),
rn=n=>Math.round((Number(n)||0)*100)/100,
nf=n=>new Intl.NumberFormat('en-US',{maximumFractionDigits:2}).format(Number(n)||0),
cf=n=>`<span class="num">${nf(n)}</span>${D.s.cur?` <span class="text-[.82em] opacity-80">${esc(D.s.cur)}</span>`:''}`,
cfp=n=>D.s.cur?`${nf(n)} ${D.s.cur}`:nf(n),
bName=()=>D.s.name.trim()||'النظام المحاسبي المؤسسي',
bEn=()=>D.s.nameEn.trim()||'ENTERPRISE ERP',
byId=(arr,id)=>arr.find(x=>x.id===id)||null,
isAdmin=()=>curUser&&curUser.role==='admin',
can=p=>isAdmin()||!!(curUser?.perms?.[p]),
who=()=>({by:curUser?curUser.name:'المدير العام',byId:curUser?curUser.id:'u_admin'}),
byBadge=n=>n?`<span class="inline-flex items-center px-1.5 py-0.5 rounded bg-slate-100 border border-slate-200 text-slate-700 text-[10px] font-bold">• ${esc(n)}</span>`:'',
lockedDateField=(lbl='التاريخ')=>`<div><label class="text-[11px] font-bold text-slate-600 block mb-1">${lbl} <span class="text-[10px] text-amber-700 font-extrabold">(مقفل على اليوم)</span></label><div class="inp w-full bg-slate-100 text-slate-700 font-black num flex items-center justify-between cursor-not-allowed select-none"><span>${fmtDate(today())}</span><span class="text-[10px] px-1.5 py-0.5 rounded bg-slate-200 text-slate-600 font-bold">تاريخ اليوم</span></div></div>`,
itemChips=items=>!(items&&items.length)?'':`<div class="flex flex-wrap gap-1 mt-1.5">${items.map(x=>`<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-lg bg-slate-100 border border-slate-200 text-[11px] text-slate-700"><strong class="text-slate-900">${esc(x.name)}</strong><span class="text-slate-400">|</span><span>العدد: <strong class="num text-blue-800">${nf(x.qty)}</strong></span><span class="text-slate-400">×</span><span>السعر: <strong class="num text-slate-800">${nf(x.pr)}</strong></span><span class="text-slate-400">=</span><strong class="num text-emerald-700">${nf(x.tot!=null?x.tot:rn((Number(x.qty)||0)*(Number(x.pr)||0)))}</strong></span>`).join('')}</div>`;

function logAct(cat,act,det,ref='',meta=null){
  const u=curUser||D.users[0]||DEF_ADMIN();
  D.logs.unshift({id:uid('lg'),ts:Date.now(),dt:today(),tm:nowTime(),uid:u.id,uname:u.name,urole:u.role==='admin'?'مدير':(u.title||'موظف'),cat,act,det,ref,meta,read:false});
  if(D.logs.length>500)D.logs.length=500;
  save();updNotifBadge();
}
function updNotifBadge(){
  const btn=$('hdr-notif'),b=$('notif-badge');
  if(btn)btn.classList.toggle('hidden',!isAdmin());
  if(!b)return;
  const cnt=isAdmin()?D.logs.filter(l=>!l.read).length:0;
  b.textContent=cnt>99?'99+':cnt;b.classList.toggle('hidden',cnt===0);
}
function showLogin(){
  const sc=$('login-screen'),au=D.users.filter(u=>u.active),da=au.find(u=>u.id==='u_admin'&&u.pin==='1234');
  sc.classList.remove('hidden');
  sc.innerHTML=`<div class="w-full max-w-md bg-white rounded-3xl shadow-2xl border overflow-hidden my-auto">
    <div class="p-6 bg-gradient-to-l from-[#0b1222] via-blue-950 to-blue-900 text-white text-center space-y-2">
      <div class="w-14 h-14 mx-auto rounded-2xl bg-white/10 border border-white/20 flex items-center justify-center font-black text-lg overflow-hidden">${D.s.logo?`<img src="${D.s.logo}" class="w-full h-full object-contain bg-white p-1"/>`:'ERP'}</div>
      <h1 class="text-lg font-black">${esc(bName())}</h1><p class="text-xs text-blue-200">تسجيل دخول الموظفين والإدارة</p>
    </div>
    <form onsubmit="doLogin(event)" class="p-5 space-y-4">
      <div><label class="text-xs font-extrabold text-slate-600 block mb-1.5">اختر الموظف</label>
        <select id="lg-u" required class="inp w-full bg-slate-50 font-bold">${au.map(u=>`<option value="${u.id}">${esc(u.name)} - ${u.role==='admin'?'مدير النظام':esc(u.title||'موظف')}</option>`).join('')}</select></div>
      <div><label class="text-xs font-extrabold text-slate-600 block mb-1.5">رمز الدخول (PIN)</label>
        <input id="lg-p" type="password" inputmode="numeric" required autocomplete="off" placeholder="أدخل الرمز السري..." class="inp w-full bg-slate-50 text-center text-lg font-black tracking-widest num"/></div>
      ${da?'<div class="text-[11px] text-center bg-blue-50 text-blue-800 border border-blue-200 rounded-xl p-2 font-bold">الرمز الافتراضي للمدير العام هو <span class="num font-black">1234</span></div>':''}
      <button class="w-full py-3 rounded-xl bg-blue-700 text-white font-extrabold text-sm cursor-pointer">دخول إلى النظام</button>
    </form></div>`;
  setTimeout(()=>$('lg-p')?.focus(),50);
}
function doLogin(e){
  e.preventDefault();
  const id=$('lg-u').value,pin=$('lg-p').value.trim(),u=D.users.find(x=>x.id===id&&x.active);
  if(!u){toast('الموظف غير متاح','err');return;}
  if(String(u.pin)!==pin){toast('رمز الدخول غير صحيح','err');$('lg-p').value='';$('lg-p').focus();return;}
  curUser=u;try{localStorage.setItem(SKEY,u.id);}catch{}
  $('login-screen').classList.add('hidden');
  logAct('sys','تسجيل دخول',`دخل ${u.name} (${u.role==='admin'?'مدير':u.title||'موظف'})`,'',{summary:[['الموظف',u.name],['الصفة',u.role==='admin'?'مدير النظام':(u.title||'موظف')],['الحالة','دخول ناجح']]});
  go('dashboard');toast(`مرحباً ${u.name}`);
}
function logout(){
  if(curUser)logAct('sys','تسجيل خروج',`خرج ${curUser.name}`,'',{summary:[['الموظف',curUser.name],['الصفة',curUser.role==='admin'?'مدير النظام':(curUser.title||'موظف')]]});
  curUser=null;try{localStorage.removeItem(SKEY);}catch{}
  closeM();sb(0);showLogin();
}

function vNotifShell(){
  if(!isAdmin())return`<div class="card p-10 text-center text-rose-700 font-extrabold">هذا القسم متاح للمدير فقط</div>`;
  const unread=D.logs.filter(l=>!l.read).length,td=today(),todayCnt=D.logs.filter(l=>l.dt===td).length;
  return `<div class="grid grid-cols-3 gap-3">
    <div class="card p-3.5 border-r-4 border-rose-600"><div class="text-xs text-slate-500 font-bold">إشعارات غير مقروءة</div><div class="text-lg font-black text-rose-600 mt-1 num">${unread}</div></div>
    <div class="card p-3.5 border-r-4 border-blue-600"><div class="text-xs text-slate-500 font-bold">حركات اليوم</div><div class="text-lg font-black text-blue-700 mt-1 num">${todayCnt}</div></div>
    <div class="card p-3.5 border-r-4 border-slate-800"><div class="text-xs text-slate-500 font-bold">إجمالي السجل</div><div class="text-lg font-black text-slate-900 mt-1 num">${D.logs.length}</div></div>
  </div>
  <div class="card p-3 flex flex-col lg:flex-row gap-2 justify-between">
    <div class="flex flex-wrap gap-2 flex-1">
      <input value="${esc(F.lq)}" oninput="F.lq=this.value;rNotifList()" placeholder="بحث في الإشعارات، الرقم، الموظف..." class="inp flex-1 min-w-[150px] bg-slate-50"/>
      <select onchange="F.lu=this.value;rNotifList()" class="inp bg-slate-50 text-xs font-bold"><option value="all">كل الموظفين</option>${D.users.map(u=>`<option value="${u.id}" ${F.lu===u.id?'selected':''}>${esc(u.name)}</option>`).join('')}</select>
      <select onchange="F.lc=this.value;rNotifList()" class="inp bg-slate-50 text-xs font-bold"><option value="all">كل الأقسام</option>${Object.entries(LOG_CATS).map(([k,[lb]])=>`<option value="${k}" ${F.lc===k?'selected':''}>${lb}</option>`).join('')}</select>
      <select onchange="F.lr=this.value;rNotifList()" class="inp bg-slate-50 text-xs font-bold"><option value="all" ${F.lr==='all'?'selected':''}>الكل</option><option value="unread" ${F.lr==='unread'?'selected':''}>غير مقروء فقط</option><option value="read" ${F.lr==='read'?'selected':''}>مقروء فقط</option></select>
    </div>
    <div class="flex gap-1.5 shrink-0">
      <button onclick="markAllRead()" class="btn b-gn py-2">تحديد الكل كمقروء</button>
      <button onclick="confirmM('مسح الإشعارات','تفريغ سجل الإشعارات بالكامل؟',()=>{D.logs=[];save();updNotifBadge();render();toast('تم تفريغ السجل');})" class="btn b-rs py-2">مسح السجل</button>
    </div>
  </div>
  <div class="text-xs font-bold text-slate-500 px-1">اضغط على أي إشعار لعرض التقرير المفصل الخاص به:</div>
  <div id="notif-list" class="min-h-[45vh]"></div>`;
}
function rNotifList(){
  const el=$('notif-list');if(!el)return;
  const q=F.lq.trim().toLowerCase(),list=D.logs.filter(l=>(F.lu==='all'||l.uid===F.lu)&&(F.lc==='all'||l.cat===F.lc)&&(F.lr==='all'||(F.lr==='unread'&&!l.read)||(F.lr==='read'&&l.read))&&(!q||(l.det||'').toLowerCase().includes(q)||(l.act||'').toLowerCase().includes(q)||(l.ref||'').toLowerCase().includes(q)||(l.uname||'').toLowerCase().includes(q)));
  el.innerHTML=!list.length?'<div class="card p-10 text-center text-slate-400 text-sm">لا توجد إشعارات مطابقة</div>':`<div class="space-y-2">${list.map(l=>{
    const[clb,ccl]=LOG_CATS[l.cat]||LOG_CATS.sys;
    return `<div onclick="openNotifReport('${l.id}')" class="card p-3.5 cursor-pointer hover:border-blue-400 transition flex flex-col sm:flex-row sm:items-center justify-between gap-2.5 ${l.read?'border-r-4 border-slate-300':'bg-blue-50/60 border-r-4 border-rose-600'}">
      <div class="min-w-0 flex-1 space-y-1">
        <div class="flex items-center gap-1.5 flex-wrap">
          ${!l.read?'<span class="w-2.5 h-2.5 rounded-full bg-rose-600 shrink-0"></span>':''}
          <span class="px-2 py-0.5 rounded text-[10px] font-extrabold ${ccl}">${clb}</span>
          <span class="font-black text-sm text-slate-900">${esc(l.act)}</span>
          ${l.ref?`<span class="num text-xs font-black text-blue-800 bg-blue-100 px-2 py-0.5 rounded">${esc(l.ref)}</span>`:''}
        </div>
        <div class="text-xs text-slate-700 font-semibold">${esc(l.det)}</div>
      </div>
      <div class="flex items-center justify-between sm:justify-end gap-3 shrink-0 pt-2 sm:pt-0 border-t sm:border-t-0">
        <div class="text-right sm:text-left text-xs">
          <div class="font-extrabold text-slate-800">${esc(l.uname)} <span class="text-[10px] text-slate-500">(${esc(l.urole)})</span></div>
          <div class="text-[11px] text-slate-500 num">${esc(fmtDate(l.dt))} • ${esc(l.tm)}</div>
        </div>
        <span class="btn b-in text-[11px] shrink-0">التقرير ←</span>
      </div>
    </div>`;
  }).join('')}</div>`;
}
function openNotifReport(id){
  if(!isAdmin())return;
  const l=byId(D.logs,id);if(!l)return;
  if(!l.read){l.read=true;save();updNotifBadge();if(view==='notifications')rNotifList();}
  const[clb,ccl]=LOG_CATS[l.cat]||LOG_CATS.sys,m=l.meta||{},items=m.items||[],sum=m.summary||[];
  let docBtn='';
  if(m.link){
    const{type,id:rid}=m.link;
    if(type==='inv'&&byId(D.invs,rid))docBtn=`<button onclick="prevInv('${rid}')" class="btn b-gn">فتح الفاتورة</button>`;
    else if(type==='ord'&&byId(D.ord,rid))docBtn=`<button onclick="issueOrPrevInv('${rid}')" class="btn b-bl">فتح الفاتورة/الطلبية</button>`;
    else if(type==='pur'&&byId(D.pur,rid))docBtn=`<button onclick="prevPur('${rid}')" class="btn b-tl">فتح سند الشراء</button>`;
    else if(type==='bond'&&byId(D.pur,rid))docBtn=`<button onclick="prevDebtBond('${rid}')" class="btn b-rd">فتح سند الدين</button>`;
    else if(type==='rv'&&byId(D.pay,rid))docBtn=`<button onclick="prevRv('${rid}')" class="btn b-gn">فتح إيصال القبض</button>`;
    else if(type==='pv'&&byId(D.spay,rid))docBtn=`<button onclick="prevPv('${rid}')" class="btn b-am">فتح إيصال الدفع</button>`;
  }
  modal(`<div class="p-4 border-b flex items-center justify-between bg-[#0b1222] text-white">
    <div class="min-w-0"><div class="text-[10px] text-rose-300 font-extrabold">تقرير إشعار مفصل (للإدارة فقط)</div><h3 class="font-black text-sm truncate">${esc(l.act)} ${l.ref?`<span class="num text-blue-300">(${esc(l.ref)})</span>`:''}</h3></div>
    <button onclick="closeM()" class="btn bg-slate-800 text-white">×</button>
  </div>
  <div class="p-4 space-y-3.5 max-h-[75vh] overflow-y-auto">
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 text-xs">
      <div class="bg-slate-50 border rounded-xl p-2.5"><span class="text-[10px] text-slate-400 block">القسم</span><span class="inline-block mt-0.5 px-2 py-0.5 rounded font-extrabold text-[10px] ${ccl}">${clb}</span></div>
      <div class="bg-slate-50 border rounded-xl p-2.5"><span class="text-[10px] text-slate-400 block">المنفّذ</span><strong class="text-slate-900 block truncate">${esc(l.uname)}</strong><span class="text-[10px] text-slate-500">${esc(l.urole)}</span></div>
      <div class="bg-slate-50 border rounded-xl p-2.5"><span class="text-[10px] text-slate-400 block">التاريخ والوقت</span><strong class="num text-slate-900 block">${esc(fmtDate(l.dt))}</strong><span class="num text-[10px] text-slate-500">${esc(l.tm)}</span></div>
      <div class="bg-slate-50 border rounded-xl p-2.5"><span class="text-[10px] text-slate-400 block">رقم المرجع</span><strong class="num text-blue-800 block">${esc(l.ref||'—')}</strong></div>
    </div>
    <div class="rounded-xl border border-blue-200 bg-blue-50/50 p-3 text-xs"><div class="text-[10px] font-extrabold text-blue-800 mb-1">ملخص العملية</div><div class="font-bold text-slate-900 leading-relaxed">${esc(l.det)}</div></div>
    ${sum.length?`<div class="rounded-xl border overflow-hidden"><div class="px-3 py-2 bg-slate-100 text-[11px] font-extrabold text-slate-700">التفاصيل المالية والإدارية</div><div class="grid grid-cols-2 sm:grid-cols-3 gap-2 p-2.5 bg-white">${sum.map(([k,v,cl])=>`<div class="rounded-lg border bg-slate-50/70 p-2"><div class="text-[10px] text-slate-500 font-bold">${esc(k)}</div><div class="text-xs font-black mt-0.5 ${cl||'text-slate-900'}">${esc(v)}</div></div>`).join('')}</div></div>`:''}
    ${items.length?`<div class="rounded-xl border overflow-hidden"><div class="px-3 py-2 bg-slate-800 text-white text-[11px] font-extrabold">تفاصيل الأصناف (${items.length})</div><table class="w-full text-xs text-right"><thead class="bg-slate-100 text-slate-700 text-[11px]"><tr><th class="p-2">الصنف</th><th class="p-2 text-center">الكمية</th><th class="p-2 text-center">السعر</th><th class="p-2 text-left">الإجمالي</th></tr></thead><tbody class="divide-y">${items.map(x=>`<tr><td class="p-2 font-bold">${esc(x.name)}</td><td class="p-2 text-center num font-bold">${nf(x.qty)}</td><td class="p-2 text-center num">${cfp(x.pr)}</td><td class="p-2 text-left num font-black text-emerald-700">${cfp(x.tot!=null?x.tot:rn((Number(x.qty)||0)*(Number(x.pr)||0)))}</td></tr>`).join('')}</tbody></table></div>`:''}
    ${m.note?`<div class="rounded-xl border bg-amber-50/70 border-amber-200 p-2.5 text-xs"><strong class="text-amber-900">ملاحظة / سبب:</strong> <span class="text-slate-800 font-semibold">${esc(m.note)}</span></div>`:''}
  </div>
  <div class="p-3 border-t bg-slate-50 flex flex-wrap items-center justify-between gap-2">
    <div class="flex gap-1.5">${docBtn}<button onclick="prevNotifReport('${l.id}')" class="btn b-dk">طباعة التقرير</button></div>
    <button onclick="closeM()" class="btn b-lt px-4">إغلاق</button>
  </div>`,'max-w-2xl');
}
function prevNotifReport(id){
  const l=byId(D.logs,id);if(!l)return;
  const[clb]=LOG_CATS[l.cat]||LOG_CATS.sys,m=l.meta||{},items=m.items||[],sum=m.summary||[];
  docModal(`تقرير إشعار - ${l.ref||l.act}`,`${docHead('تقرير إشعار رقابي','AUDIT NOTIFICATION REPORT',`<div class="flex justify-between"><span>المرجع:</span><strong class="num">${esc(l.ref||'—')}</strong></div><div class="flex justify-between"><span>التاريخ:</span><strong class="num">${esc(fmtDate(l.dt))} ${esc(l.tm)}</strong></div><div class="flex justify-between"><span>الموظف:</span><strong>${esc(l.uname)}</strong></div>`,'bg-gradient-to-l from-[#0b1222] via-slate-800 to-rose-900','bg-white/10')}

    ${sum.length?`<div class="grid grid-cols-3 gap-2">${sum.map(([k,v])=>`<div class="rounded-lg border bg-white p-2"><div class="text-[9px] text-slate-500 font-bold">${esc(k)}</div><div class="text-xs font-black text-slate-900 mt-0.5">${esc(v)}</div></div>`).join('')}</div>`:''}
    ${items.length?`<div class="rounded-lg border overflow-hidden bg-white"><table class="w-full text-[10px] text-right table-fixed"><thead><tr class="bg-slate-900 text-white"><th class="p-1.5 w-[8%] text-center">#</th><th class="p-1.5 w-[44%]">الصنف</th><th class="p-1.5 w-[14%] text-center">العدد</th><th class="p-1.5 w-[16%] text-center">السعر</th><th class="p-1.5 w-[18%] text-left">الإجمالي</th></tr></thead><tbody class="divide-y">${items.map((x,n)=>`<tr><td class="p-1.5 text-center num">${n+1}</td><td class="p-1.5 font-bold">${esc(x.name)}</td><td class="p-1.5 text-center num">${nf(x.qty)}</td><td class="p-1.5 text-center num">${cfp(x.pr)}</td><td class="p-1.5 text-left font-black num">${cfp(x.tot!=null?x.tot:rn((Number(x.qty)||0)*(Number(x.pr)||0)))}</td></tr>`).join('')}</tbody></table></div>`:''}
    ${m.note?`<div class="rounded-lg border border-amber-200 bg-amber-50 p-2.5 text-xs"><strong>ملاحظة:</strong> ${esc(m.note)}</div>`:''}

function markAllRead(){D.logs.forEach(l=>l.read=true);save();updNotifBadge();render();toast('تم تحديد الكل كمقروء');}

function waClean(ph){let d=String(ph||'').replace(/[^\d]/g,'');if(!d)return'';if(d.startsWith('00'))d=d.slice(2);else if(d.startsWith('09')&&d.length===10)d='963'+d.slice(1);return d;}
function openWA(ph,msg=''){const n=waClean(ph),t=msg?`?text=${encodeURIComponent(msg)}`:'';window.open(n?`https://wa.me/${n}${t}`:`https://wa.me/${t}`,'_blank');}
const waBtn=(ph,lbl='واتساب')=>`<button onclick="openWA('${esc(ph||'')}')" class="btn b-gn">${lbl||'واتساب'}</button>`;

function cStats(id){
  const c=byId(D.cust,id);if(!c)return{cnt:0,invCnt:0,sales:0,paid:0,bal:0};
  const op=Number(c.open)||0,ords=D.ord.filter(o=>o.cid===id),invs=D.invs.filter(v=>v.cid===id),pays=D.pay.filter(p=>p.cid===id);
  const sales=rn(ords.reduce((a,o)=>a+(Number(o.total)||0),0)),paid=rn(ords.reduce((a,o)=>a+(Number(o.paid)||0),0)+pays.reduce((a,p)=>a+(Number(p.amt)||0),0));
  return{cnt:ords.length,invCnt:invs.length,sales,paid,bal:rn(op+sales-paid)};
}
function cLedger(id){
  const c=byId(D.cust,id);if(!c)return[];
  const L=[],op=Number(c.open)||0,invIds=new Set();
  if(op)L.push({dt:'-',k:0,ref:'رصيد سابق',desc:'رصيد افتتاحي مرحّل',d:op>0?op:0,c:op<0?-op:0});
  D.invs.filter(v=>v.cid===id).forEach(v=>{
    (v.ordIds||[]).forEach(x=>invIds.add(x));
    L.push({dt:v.date,k:v.ts||0,ref:v.invNum,desc:`فاتورة ${v.invNum}${(v.ordNums||[]).length?' ('+v.ordNums.join('، ')+')':''}`,d:Number(v.total)||0,c:0});
    if((Number(v.paid)||0)>0)L.push({dt:v.date,k:(v.ts||0)+1,ref:v.invNum,desc:`دفعة مع الفاتورة ${v.invNum}${v.pm?' ('+v.pm+')':''}`,d:0,c:Number(v.paid)||0});
  });
  D.ord.filter(o=>o.cid===id&&!invIds.has(o.id)).forEach(o=>{
    L.push({dt:o.date,k:o.ts||0,ref:o.num,desc:`طلبية ${o.num} - ${(o.items||[]).map(x=>x.name+' ×'+nf(x.qty)).join('، ')}`,d:Number(o.total)||0,c:0});
    if((Number(o.paid)||0)>0)L.push({dt:o.date,k:(o.ts||0)+1,ref:o.num,desc:`دفعة (${o.pm||'كاش'}) مع ${o.num}`,d:0,c:Number(o.paid)||0});
  });
  D.pay.filter(p=>p.cid===id).forEach(p=>L.push({dt:p.date,k:p.ts||0,ref:p.num||'RV',desc:`إيصال قبض (${p.m||'كاش'})${p.note?' - '+p.note:''}`,d:0,c:Number(p.amt)||0}));
  L.sort((a,b)=>a.k-b.k);let r=0;return L.map(x=>{r=rn(r+x.d-x.c);return{...x,r};});
}
function purPaid(purId){return rn(D.spay.filter(p=>p.purId===purId).reduce((a,p)=>a+(Number(p.amt)||0),0));}
function purRem(pur){return Math.max(0,rn((Number(pur?.total)||0)-purPaid(pur?.id)));}
function debtBonds(sid=''){return D.pur.filter(p=>(p.bondNum||p.payType==='debt'||p.payType==='partial'||purRem(p)>0)&&(!sid||p.sid===sid)).sort((a,b)=>(b.ts||0)-(a.ts||0));}
function openDebtBondsCount(sid=''){return debtBonds(sid).filter(p=>purRem(p)>0).length;}
function sStats(id){
  const s=byId(D.sup,id);if(!s)return{cnt:0,tot:0,paid:0,bal:0,openBonds:0};
  const op=Number(s.open)||0,purs=D.pur.filter(p=>p.sid===id),pays=D.spay.filter(p=>p.sid===id);
  const tot=rn(purs.reduce((a,p)=>a+(Number(p.total)||0),0)),paid=rn(pays.reduce((a,p)=>a+(Number(p.amt)||0),0));
  return{cnt:purs.length,tot,paid,bal:rn(op+tot-paid),openBonds:openDebtBondsCount(id)};
}
function sLedger(id){
  const s=byId(D.sup,id);if(!s)return[];
  const L=[],op=Number(s.open)||0;
  if(op)L.push({dt:'-',k:0,ref:'رصيد سابق',desc:'رصيد افتتاحي للتاجر',cr:op>0?op:0,dr:op<0?-op:0});
  D.pur.filter(p=>p.sid===id).forEach(p=>L.push({dt:p.date,k:p.ts||0,ref:p.bondNum||p.num,desc:`${p.payType==='cash'?'شراء نقدي':'سند دين '+(p.bondNum||'')} (${p.num}) - ${(p.items||[]).map(x=>x.name+' ×'+nf(x.qty)).join('، ')}`,cr:Number(p.total)||0,dr:0}));
  D.spay.filter(p=>p.sid===id).forEach(p=>L.push({dt:p.date,k:p.ts||0,ref:p.num||'PV',desc:`إيصال دفع ${p.num||''} (${p.m||'كاش'})${p.bondNum?' • سداد '+p.bondNum:p.purNum?' • مقابل '+p.purNum:''}${p.reason?' • '+p.reason:''}${p.note?' - '+p.note:''}`,cr:0,dr:Number(p.amt)||0}));
  L.sort((a,b)=>a.k-b.k);let r=0;return L.map(x=>{r=rn(r+x.cr-x.dr);return{...x,r};});
}
function dashStats(){
  const sales=rn(D.ord.reduce((a,o)=>a+(Number(o.total)||0),0)),coll=rn(D.ord.reduce((a,o)=>a+(Number(o.paid)||0),0)+D.pay.reduce((a,p)=>a+(Number(p.amt)||0),0)),
  totPur=rn(D.pur.filter(p=>p.sid).reduce((a,p)=>a+(Number(p.total)||0),0)),paidSup=rn(D.spay.reduce((a,p)=>a+(Number(p.amt)||0),0)),exp=rn(D.exp.reduce((a,e)=>a+(Number(e.amt)||0),0));
  let gp=0;D.ord.forEach(o=>{gp+=(Number(o.total)||0)-(o.items||[]).reduce((a,x)=>a+(Number(x.cost)||0)*(Number(x.qty)||0),0);});
  const debtors=D.cust.map(c=>({...c,...cStats(c.id)})).filter(x=>x.bal>0).sort((a,b)=>b.bal-a.bal),
  creditors=D.sup.map(s=>({...s,...sStats(s.id)})).filter(x=>x.bal>0).sort((a,b)=>b.bal-a.bal),
  wCost=rn(D.prod.reduce((a,p)=>a+Math.max(0,Number(p.qty)||0)*(Number(p.cost)||0),0)),
  wSell=rn(D.prod.reduce((a,p)=>a+Math.max(0,Number(p.qty)||0)*(Number(p.sell)||0),0)),
  low=D.prod.filter(p=>(Number(p.qty)||0)<=(Number(p.min)||0));
  return{sales,coll,totPur,paidSup,exp,profit:rn(gp-exp),cash:rn(coll-exp-paidSup),debtors,debts:rn(debtors.reduce((a,x)=>a+x.bal,0)),creditors,payables:rn(creditors.reduce((a,x)=>a+x.bal,0)),openBonds:openDebtBondsCount(),wCost,wSell,low};
}
const stBadge=(s,pm)=>s==='paid'?[`مدفوع${pm?' • '+pm:''}`,'bg-emerald-100 text-emerald-800 border-emerald-300']:s==='partial'?[`جزئي${pm?' • '+pm:''}`,'bg-amber-100 text-amber-900 border-amber-300']:['دين (آجل)','bg-rose-100 text-rose-800 border-rose-300'];
const skBadge=p=>{const q=Number(p.qty)||0,m=Number(p.min)||0;return q<=0?['out','نافذ','bg-rose-100 text-rose-800 border-rose-300']:q<=m?['low','منخفض','bg-amber-100 text-amber-900 border-amber-300']:['ok','متوفر','bg-teal-100 text-teal-800 border-teal-300'];};

function sb(o){$('sb').classList.toggle('translate-x-full',!o);$('sb-bg').classList.toggle('hidden',!o);}
function toast(msg,t='ok'){const c=$('toasts'),el=document.createElement('div');el.className=`pointer-events-auto px-4 py-2.5 rounded-xl text-white text-xs sm:text-sm font-bold shadow-xl ${t==='err'?'bg-rose-600':t==='warn'?'bg-amber-600':t==='info'?'bg-blue-600':'bg-[#0b1222]'}`;el.textContent=msg;c.appendChild(el);setTimeout(()=>el.remove(),2800);}
function modal(html,w='max-w-lg'){const r=$('modal');r.className='fixed inset-0 z-50 flex items-start sm:items-center justify-center p-2.5 sm:p-4 pt-4 bg-slate-950/70 overflow-y-auto';r.innerHTML=`<div class="w-full ${w} bg-white rounded-2xl shadow-2xl border overflow-hidden mb-10 sm:my-auto" onclick="event.stopPropagation()">${html}</div>`;r.onclick=closeM;}
function closeM(){const r=$('modal');r.className='fixed inset-0 z-50 hidden';r.innerHTML='';curWA=null;}
function confirmM(title,msg,fn,cls='b-rd'){window._cf=fn;modal(`<div class="p-5 space-y-4"><h3 class="text-base font-extrabold">${esc(title)}</h3><p class="text-sm text-slate-600">${esc(msg)}</p><div class="flex justify-end gap-2 pt-2 border-t"><button onclick="closeM()" class="btn b-lt px-4 py-2">إلغاء</button><button onclick="closeM();window._cf&&window._cf()" class="btn ${cls} px-4 py-2">تأكيد</button></div></div>`,'max-w-sm');}

function docModal(title,bodyHtml,waInfo=null,barBg='bg-[#0b1222]',plainWrap=false){
  curWA=waInfo;const r=$('modal');r.className='fixed inset-0 z-50 flex flex-col bg-slate-900 overflow-hidden';r.onclick=null;
  r.innerHTML=`<div id="doc-shell" class="w-full h-[100dvh] flex flex-col overflow-hidden">
    <div id="doc-bar" class="no-print h-12 px-2.5 sm:px-5 ${barBg} text-white border-b border-white/10 flex items-center justify-between gap-1.5 shrink-0">
      <span class="font-bold text-xs truncate">● ${esc(title)}</span>
      <div class="flex items-center gap-1.5 shrink-0">
        ${waInfo?'<button onclick="curWA&&openWA(curWA.ph,curWA.msg)" class="btn b-gn text-[11px]">واتساب</button>':''}
        <button onclick="ssMode(1)" class="btn b-in text-[11px]">لقطة</button>
        <button onclick="window.print()" class="btn b-bl text-[11px]">طباعة</button>
        <button onclick="closeM()" class="btn bg-slate-800 text-slate-200 text-[11px]">إغلاق</button>
      </div>
    </div>
    <div id="doc-stage" onclick="if($('doc-bar')?.classList.contains('hidden'))ssMode(0)" class="${plainWrap?'bg-slate-200':'bg-slate-300/90'} p-2"><div id="doc-wrap"><div id="print-area" class="${plainWrap?'bg-white text-slate-900 rounded-2xl shadow-2xl overflow-hidden':'bg-white text-slate-900 rounded-xl shadow-2xl border overflow-hidden'}">${bodyHtml}</div></div></div>
  </div>`;
  requestAnimationFrame(()=>{fitDoc();setTimeout(fitDoc,70);});

function ssMode(h){const b=$('doc-bar');if(!b)return;b.classList.toggle('hidden',!!h);if(h)toast('اضغط بأي مكان لإظهار الشريط','info');requestAnimationFrame(fitDoc);}

function calcOrd(man=0){

function calcPur(man=0){
  const tot=rn(draft.reduce((a,r)=>a+r.qty*r.pr,0)),st=$('pst'),pe=$('ppd'),hint=$('pur-mode-hint'),btn=$('pur-submit-btn');
  if(!st||!pe)return;
  let pd=Number(pe.value)||0;
  if(!man){pd=st.value==='cash'?tot:st.value==='debt'?0:(pd>=tot?0:pd);pe.value=pd;pe.readOnly=(st.value!=='partial');}
  else{pd=Math.max(0,Math.min(tot,pd));st.value=pd>=tot&&tot>0?'cash':pd<=0&&tot>0?'debt':'partial';}
  const rem=rn(tot-pd);
  $('ppm-wrap')?.classList.toggle('hidden',st.value==='debt');
  $('ppd-wrap')?.classList.toggle('opacity-50',!man&&st.value!=='partial');

function saveProd(e,id){
  e.preventDefault();
  const ex=id?byId(D.prod,id):null,locked=!!(ex&&ex.qtyLocked);
  const enteredQty=locked?Number(ex.qty)||0:Math.max(0,Number($('pq1')?.value)||0);
  const nowLocked=locked||(enteredQty>0);
  const obj={name:$('pn1').value.trim(),cost:Number($('pc1').value)||0,sell:Number($('ps1').value)||0,qty:enteredQty,qtyLocked:nowLocked,min:Math.max(0,Number($('pm1').value)||0)};
  if(!obj.name)return;
  if(id&&ex){
    const i=D.prod.findIndex(x=>x.id===id);
    if(i>-1)D.prod[i]={...D.prod[i],...obj};
    logAct('wh','تعديل صنف',`تعديل بيانات الصنف «${obj.name}» (الكمية: ${nf(obj.qty)})`,'',{summary:[['الصنف',obj.name],['سعر التكلفة',cfp(obj.cost)],['سعر البيع',cfp(obj.sell)],['الكمية الحالية',nf(obj.qty)],['حالة القفل',nowLocked?'مقفلة':'مفتوحة']]});
  }else{
    D.prod.push({id:uid('pr'),...obj,...who(),ts:Date.now()});
    logAct('wh','إضافة صنف جديد',`إضافة «${obj.name}» بكمية افتتاحية ${nf(obj.qty)}`,'',{summary:[['الصنف',obj.name],['التكلفة',cfp(obj.cost)],['سعر البيع',cfp(obj.sell)],['أول كمية',nf(obj.qty)],['حالة القفل',nowLocked?'تم القفل تلقائياً':'لم تُدخل كمية بعد']]});
  }
  save();closeM();render();toast(nowLocked&&!locked?'تم الحفظ وقفل الكمية تلقائياً':'تم حفظ الصنف');
}
function delProd(id){if(!can('del')){toast('لا تملك الصلاحية','err');return;}const p=byId(D.prod,id);if(!p)return;confirmM('حذف الصنف','هل أنت متأكد؟',()=>{D.prod=D.prod.filter(x=>x.id!==id);logAct('wh','حذف صنف',`حذف الصنف «${p.name}» (الكمية كانت ${nf(p.qty)})`,'',{summary:[['الصنف',p.name],['الكمية عند الحذف',nf(p.qty)]]});save();render();toast('تم الحذف');});}

function vExpShell(){const tot=D.exp.reduce((a,e)=>a+(Number(e.amt)||0),0);return`<div class="bg-gradient-to-l from-rose-950 via-rose-800 to-rose-600 rounded-2xl p-5 text-white flex flex-col sm:flex-row justify-between sm:items-center gap-3"><div><div class="text-xs text-rose-200 font-bold">إجمالي المصاريف (${D.exp.length})</div><div class="text-2xl font-black mt-0.5">${cf(tot)}</div></div><div class="flex gap-2"><button onclick="prevExp()" class="btn bg-white/15 text-white py-2">تقرير</button><button onclick="openExpModal()" class="btn bg-white text-rose-800 py-2">+ مصروف</button></div></div><div id="exp-list"></div>`;}
function rExpList(){const el=$('exp-list');if(!el)return;const list=[...D.exp].sort((a,b)=>(b.ts||0)-(a.ts||0));el.innerHTML=!list.length?'<div class="card p-10 text-center text-slate-400 text-sm">لا توجد مصاريف</div>':`<div class="card divide-y">${list.map(e=>`<div class="p-3.5 flex justify-between items-center gap-2 border-r-4 border-rose-500"><div><div class="font-bold text-sm flex items-center gap-1.5 flex-wrap"><span>${esc(e.title)}</span><span class="text-[10px] px-2 py-0.5 rounded-full bg-rose-50 text-rose-800 border">${esc(e.cat||'أخرى')}</span>${byBadge(e.by)}</div><div class="text-xs text-slate-400"><span class="num">${esc(fmtDate(e.date))}</span> ${e.note?'• '+esc(e.note):''}</div></div><div class="flex items-center gap-2"><strong class="text-rose-700">${cf(e.amt)}</strong>${can('del')?`<button onclick="delExp('${e.id}')" class="btn b-rs">حذف</button>`:''}</div></div>`).join('')}</div>`;}
function openExpModal(){modal(`<div class="p-4 border-b flex justify-between bg-rose-700 text-white"><h3 class="font-extrabold">تسجيل مصروف</h3><button onclick="closeM()" class="cursor-pointer">×</button></div><form onsubmit="saveExp(event)" class="p-4 space-y-3"><input id="et" required placeholder="وصف المصروف *" class="inp w-full"/><div class="grid grid-cols-2 gap-2.5"><select id="ec" class="inp">${CATS.map(c=>`<option>${c}</option>`).join('')}</select><input id="ea" type="number" min="0.01" step="any" required placeholder="المبلغ *" class="inp font-bold text-rose-600 num"/></div><div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">${lockedDateField('تاريخ المصروف')}<div><label class="text-[11px] font-bold text-slate-600 block mb-1">ملاحظة</label><input id="en" placeholder="ملاحظة..." class="inp w-full"/></div></div><div class="flex justify-end gap-2"><button type="button" onclick="closeM()" class="btn b-lt px-4 py-2">إلغاء</button><button class="btn b-rd px-5 py-2">حفظ</button></div></form>`);}
function saveExp(e){e.preventDefault();const obj={id:uid('ex'),title:$('et').value.trim(),cat:$('ec').value,amt:Number($('ea').value)||0,date:today(),note:$('en').value.trim(),...who(),ts:Date.now()};D.exp.push(obj);logAct('exp','تسجيل مصروف',`${obj.title} — ${cfp(obj.amt)} (${obj.cat})`,'',{summary:[['البند',obj.title],['التصنيف',obj.cat],['المبلغ',cfp(obj.amt),'text-rose-700']],note:obj.note});save();closeM();render();toast('تم التسجيل');}
function delExp(id){if(!can('del')){toast('لا تملك الصلاحية','err');return;}const e=byId(D.exp,id);if(!e)return;confirmM('حذف المصروف','هل أنت متأكد؟',()=>{D.exp=D.exp.filter(x=>x.id!==id);logAct('exp','حذف مصروف',`حذف مصروف «${e.title}» بقيمة ${cfp(e.amt)}`,'',{summary:[['البند',e.title],['المبلغ المحذوف',cfp(e.amt),'text-rose-600']]});save();render();toast('تم الحذف');});}
function prevExp(){const list=[...D.exp].sort((a,b)=>(b.ts||0)-(a.ts||0)),tot=list.reduce((a,e)=>a+(Number(e.amt)||0),0);docModal('تقرير المصاريف',`${docHead('تقرير المصاريف','EXPENSES REPORT',`<div class="flex justify-between"><span>التاريخ:</span><strong class="num">${fmtDate(today())}</strong></div>`,'bg-gradient-to-l from-rose-950 via-rose-800 to-rose-600','bg-white/10')}<div class="px-4 py-3 space-y-2.5"><div class="rounded-lg bg-rose-700 text-white p-2.5 flex justify-between"><span>الإجمالي</span><span class="text-lg font-black">${cf(tot)}</span></div><div class="rounded-lg border overflow-hidden bg-white"><table class="w-full text-[9.5px] text-right table-fixed"><thead><tr class="bg-rose-900 text-white"><th class="p-1.5 w-[16%]">التاريخ</th><th class="p-1.5 w-[34%]">البند</th><th class="p-1.5 w-[16%]">التصنيف</th><th class="p-1.5 w-[16%]">الموظف</th><th class="p-1.5 w-[18%] text-left">المبلغ</th></tr></thead><tbody class="divide-y">${list.length?list.map(e=>`<tr><td class="p-1.5"><span class="num">${esc(fmtDate(e.date))}</span></td><td class="p-1.5 font-bold">${esc(e.title)}</td><td class="p-1.5">${esc(e.cat||'')}</td><td class="p-1.5">${esc(e.by||'-')}</td><td class="p-1.5 text-left font-bold text-rose-700"><span class="num">${nf(e.amt)}</span></td></tr>`).join(''):'<tr><td colspan="5" class="p-4 text-center text-slate-400">لا توجد مصاريف</td></tr>'}</tbody></table></div></div>`,null,'bg-rose-950');}

function vStaffShell(){
  const actCnt=D.users.filter(u=>u.active).length,unread=D.logs.filter(l=>!l.read).length;
  return `<div class="grid grid-cols-3 gap-3"><div class="card p-3.5 border-r-4 border-indigo-600"><div class="text-xs text-slate-500">الموظفون</div><div class="text-lg font-black mt-1 num">${D.users.length}</div></div><div class="card p-3.5 border-r-4 border-emerald-600"><div class="text-xs text-slate-500">النشطون</div><div class="text-lg font-black text-emerald-700 mt-1 num">${actCnt}</div></div><div onclick="go('notifications')" class="card p-3.5 border-r-4 border-rose-600 cursor-pointer"><div class="text-xs text-slate-500">إشعارات جديدة</div><div class="text-lg font-black text-rose-600 mt-1 num">${unread}</div></div></div>
  <div class="flex justify-between items-center"><button onclick="go('notifications')" class="btn b-rd py-2 px-4">فتح قسم الإشعارات (${unread})</button><button onclick="openEmpModal()" class="btn b-in py-2 px-4">+ إضافة موظف</button></div>
  <div class="space-y-2.5">${D.users.map(u=>{const acts=D.logs.filter(l=>l.uid===u.id).length,isMe=curUser&&curUser.id===u.id;return`<div class="card p-4 border-r-4 ${u.active?'border-indigo-600':'border-slate-300 opacity-75'} flex flex-col sm:flex-row sm:items-center justify-between gap-3"><div class="space-y-1"><div class="flex items-center gap-2 flex-wrap"><span class="font-black">${esc(u.name)}</span><span class="px-2 py-0.5 rounded-full text-[10px] font-extrabold ${u.role==='admin'?'bg-amber-100 text-amber-900':'bg-sky-100 text-sky-900'}">${u.role==='admin'?'مدير':esc(u.title||'موظف')}</span><span class="px-2 py-0.5 rounded-full text-[10px] font-bold ${u.active?'bg-emerald-100 text-emerald-800':'bg-rose-100 text-rose-800'}">${u.active?'نشط':'موقوف'}</span></div><div class="text-xs text-slate-500 flex gap-3"><span>الرمز: <strong class="num text-slate-800">${esc(u.pin)}</strong></span><span>الحركات: <strong class="num text-indigo-700">${acts}</strong></span></div></div><div class="flex flex-wrap gap-1.5"><button onclick="F.lu='${u.id}';go('notifications')" class="btn bg-indigo-50 text-indigo-800">تقارير حركاته</button><button onclick="openEmpModal('${u.id}')" class="btn b-lt">تعديل</button>${!isMe?`<button onclick="toggleEmp('${u.id}')" class="btn ${u.active?'bg-amber-50 text-amber-800':'bg-emerald-50 text-emerald-800'}">${u.active?'إيقاف':'تفعيل'}</button><button onclick="delEmp('${u.id}')" class="btn b-rs">حذف</button>`:''}</div></div>`;}).join('')}</div>`;
}
function openEmpModal(id=''){
  const u=id?byId(D.users,id):null;
  modal(`<div class="p-4 border-b flex justify-between bg-indigo-700 text-white"><h3 class="font-extrabold">${u?'تعديل موظف':'إضافة موظف'}</h3><button onclick="closeM()" class="cursor-pointer">×</button></div>
    <form onsubmit="saveEmp(event,'${id}')" class="p-4 space-y-3"><input id="enm" required value="${esc(u?.name||'')}" placeholder="اسم الموظف *" class="inp w-full font-bold"/><div class="grid grid-cols-2 gap-2.5"><input id="etit" value="${esc(u?.title||'')}" placeholder="المسمى الوظيفي" class="inp"/><input id="epin" required inputmode="numeric" value="${esc(u?.pin||'')}" placeholder="رمز PIN *" class="inp font-black num"/></div>
    <select id="erole" onchange="$('eperms').classList.toggle('hidden',this.value==='admin')" class="inp w-full font-bold"><option value="staff" ${!u||u.role==='staff'?'selected':''}>موظف</option><option value="admin" ${u?.role==='admin'?'selected':''}>مدير كامل</option></select>
    <div id="eperms" class="p-3 rounded-xl bg-slate-50 border space-y-2 text-xs font-bold ${u?.role==='admin'?'hidden':''}"><label class="flex items-center gap-2"><input id="ep-del" type="checkbox" ${u?.perms?.del?'checked':''}/> السماح بالحذف</label><label class="flex items-center gap-2"><input id="ep-fin" type="checkbox" ${!u||u?.perms?.fin?'checked':''}/> إظهار الأرباح والصندوق</label><label class="flex items-center gap-2"><input id="ep-set" type="checkbox" ${u?.perms?.set?'checked':''}/> إعدادات الشركة</label></div>
    <div class="flex justify-end gap-2"><button type="button" onclick="closeM()" class="btn b-lt px-4 py-2">إلغاء</button><button class="btn b-in px-5 py-2">حفظ</button></div></form>`);
}
function saveEmp(e,id){
  e.preventDefault();const name=$('enm').value.trim(),title=$('etit').value.trim()||'موظف',pin=$('epin').value.trim(),role=$('erole').value;if(!name||!pin)return;
  const perms=role==='admin'?{del:true,fin:true,set:true}:{del:$('ep-del').checked,fin:$('ep-fin').checked,set:$('ep-set').checked};
  if(id){const i=D.users.findIndex(x=>x.id===id);if(i>-1){if(D.users[i].role==='admin'&&role!=='admin'&&D.users.filter(x=>x.role==='admin'&&x.active).length<=1){toast('لا يمكن إلغاء المدير الوحيد','err');return;}D.users[i]={...D.users[i],name,title,pin,role,perms};if(curUser&&curUser.id===id)curUser=D.users[i];logAct('sys','تعديل موظف',`تعديل بيانات «${name}»`,'',{summary:[['الاسم',name],['الدور',role==='admin'?'مدير':title]]});}}
  else{D.users.push({id:uid('u'),name,title,pin,role,active:true,perms,ts:Date.now()});logAct('sys','إضافة موظف',`إضافة موظف جديد «${name}»`,'',{summary:[['الاسم',name],['الدور',role==='admin'?'مدير':title]]});}
  save();closeM();render();toast('تم الحفظ');
}
function toggleEmp(id){const u=byId(D.users,id);if(!u)return;if(u.role==='admin'&&u.active&&D.users.filter(x=>x.role==='admin'&&x.active).length<=1){toast('لا يمكن إيقاف المدير الوحيد','err');return;}u.active=!u.active;logAct('sys',u.active?'تفعيل موظف':'إيقاف موظف',`${u.active?'تفعيل':'إيقاف'} حساب «${u.name}»`);save();render();}
function delEmp(id){const u=byId(D.users,id);if(!u)return;if(u.role==='admin'&&D.users.filter(x=>x.role==='admin'&&x.active).length<=1){toast('لا يمكن حذف المدير الوحيد','err');return;}confirmM('حذف '+u.name,'سيُزال الموظف مع بقاء سجلاته السابقة.',()=>{D.users=D.users.filter(x=>x.id!==id);logAct('sys','حذف موظف',`حذف حساب «${u.name}»`);save();render();toast('تم الحذف');});}

function vSettings(){
  const s=D.s;
  return `<div class="grid grid-cols-1 lg:grid-cols-3 gap-4"><form onsubmit="saveSet(event)" class="lg:col-span-2 card p-4 space-y-3"><h3 class="font-extrabold border-b pb-2">هوية الشركة والعملة</h3>
    <div class="flex items-center gap-3 p-3 rounded-xl bg-slate-50 border"><div class="w-12 h-12 rounded-xl border bg-white flex items-center justify-center overflow-hidden">${s.logo?`<img src="${s.logo}" class="w-full h-full object-contain p-1"/>`:'<span class="text-[10px] text-slate-400 font-bold">LOGO</span>'}</div><label class="btn b-bl">رفع شعار<input type="file" accept="image/*" onchange="upLogo(event)" class="hidden"/></label>${s.logo?'<button type="button" onclick="D.s.logo=\'\';save();render()" class="btn b-rs">إزالة</button>':''}</div>
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5"><input id="snm" value="${esc(s.name)}" placeholder="اسم الشركة بالعربية" class="inp"/><input id="sne" value="${esc(s.nameEn)}" placeholder="Company Name" class="inp num"/><input id="sph" value="${esc(s.phone)}" placeholder="الهاتف" class="inp num"/><input id="scur" value="${esc(s.cur)}" placeholder="العملة ($ / SYP)" class="inp num"/><input id="sbnk" value="${esc(s.bank)}" placeholder="اسم البنك" class="inp"/><input id="sibn" value="${esc(s.iban)}" placeholder="IBAN / حساب" class="inp num"/></div>
    <input id="sadr" value="${esc(s.addr)}" placeholder="العنوان" class="inp w-full"/><input id="sft" value="${esc(s.foot)}" placeholder="تذييل الفواتير" class="inp w-full"/>
    <div class="flex justify-end"><button class="btn b-bl px-6 py-2.5">حفظ الإعدادات</button></div></form>
    <div class="space-y-3"><div class="card p-4 space-y-2.5"><h3 class="font-extrabold text-sm">النسخ الاحتياطي</h3><button onclick="expJSON()" class="btn b-dk w-full py-2.5">تصدير نسخة (JSON)</button><label class="btn b-lt w-full py-2.5 border">استيراد نسخة (JSON)<input type="file" accept=".json" onchange="impJSON(event)" class="hidden"/></label></div>
    <div class="card p-4 space-y-2.5"><h3 class="font-extrabold text-sm">التجربة وإعادة الضبط</h3><button onclick="loadSample()" class="btn bg-blue-50 text-blue-800 border w-full py-2.5">بيانات تجريبية</button><button onclick="confirmM('تصفير النظام','مسح جميع البيانات نهائياً؟',()=>{D=clone(DEF);save();logout();})" class="btn b-rs border w-full py-2.5">تصفير كافة البيانات</button></div></div></div>`;
}
function upLogo(e){const f=e.target.files?.[0];if(!f)return;const img=new Image(),rd=new FileReader();rd.onload=ev=>{img.onload=()=>{const cv=document.createElement('canvas'),m=160,sc=Math.min(1,m/Math.max(img.width,img.height));cv.width=img.width*sc;cv.height=img.height*sc;cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);D.s.logo=cv.toDataURL('image/png',0.85);save();render();toast('تم رفع الشعار');};img.src=ev.target.result;};rd.readAsDataURL(f);}
function saveSet(e){e.preventDefault();Object.assign(D.s,{name:$('snm').value.trim(),nameEn:$('sne').value.trim(),phone:$('sph').value.trim(),cur:$('scur').value.trim()||'$',bank:$('sbnk').value.trim(),iban:$('sibn').value.trim(),addr:$('sadr').value.trim(),foot:$('sft').value.trim()});logAct('sys','تحديث الإعدادات','تعديل هوية الشركة وإعداداتها');save();render();toast('تم الحفظ');}
function expJSON(){const b=new Blob([JSON.stringify(D)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=`erp-${today()}.json`;a.click();URL.revokeObjectURL(u);toast('تم التصدير');}
function impJSON(e){const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=ev=>{try{localStorage.setItem(KEY,ev.target.result);D=load();render();toast('تم الاستيراد');}catch{toast('ملف غير صالح','err');}};r.readAsText(f);}
function loadSample(){
  if(!D.s.name)Object.assign(D.s,{name:'شركة عباس للزجاج',nameEn:'ABBAS GLASS CO.',cur:'$',phone:'0931742603',addr:'دمشق - الكسوة',bank:'Commercial Bank',iban:''});
  const w=who(),c1={id:uid('c'),name:'موسى مصر',phone:'0933112233',addr:'دمشق',open:0,...w,ts:Date.now()-5e5},s1={id:uid('s'),name:'شركة النور للتوريدات',phone:'0944556677',addr:'المنطقة الصناعية',open:0,...w,ts:Date.now()-5e5},p1={id:uid('pr'),name:'مفرد | سيكوريت (شفاف) 5 ملم',cost:12,sell:15,qty:100,qtyLocked:true,min:10,...w,ts:Date.now()-5e5},p2={id:uid('pr'),name:'مفرد | سيكوريت (شفاف) 10 ملم',cost:14,sell:20,qty:80,qtyLocked:true,min:10,...w,ts:Date.now()-4e5},p3={id:uid('pr'),name:'مفرد | عادي (شفاف) 6 ملم',cost:10,sell:15,qty:60,qtyLocked:true,min:5,...w,ts:Date.now()-3e5};
  D.cust.push(c1);D.sup.push(s1);D.prod.push(p1,p2,p3);
  const pur1={id:uid('pur'),num:D.s.purP+D.s.nPur++,bondNum:D.s.dnP+D.s.nDn++,payType:'debt',date:today(),sid:s1.id,sname:s1.name,items:[{pid:p1.id,name:p1.name,qty:100,pr:12,tot:1200},{pid:p2.id,name:p2.name,qty:80,pr:14,tot:1120}],total:2320,note:'توريد أول بالدين',...w,ts:Date.now()-3e5};
  D.pur.push(pur1);
  D.ord.push({id:uid('ord'),num:D.s.ordP+D.s.nOrd++,invId:null,invNum:null,date:today(),cid:c1.id,cname:c1.name,cph:c1.phone,items:[{pid:p1.id,name:p1.name,qty:59,pr:15,cost:12,tot:885},{pid:p2.id,name:p2.name,qty:32,pr:20,cost:14,tot:640},{pid:p3.id,name:p3.name,qty:1,pr:15,cost:10,tot:15}],total:1540,paid:1540,rem:0,st:'paid',pm:'كاش',note:'',...w,ts:Date.now()-2e5});
  logAct('sys','بيانات تجريبية','تم تحميل بيانات تجريبية بنجاح');save();go('dashboard');toast('تم التحميل');
}

document.addEventListener('DOMContentLoaded',()=>{
  let savedUid=null;try{savedUid=localStorage.getItem(SKEY);}catch{}
  if(savedUid){const u=D.users.find(x=>x.id===savedUid&&x.active);if(u){curUser=u;go('dashboard');return;}}
  showLogin();
});
</script>
</body>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>النظام المحاسبي المؤسسي</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800;900&family=Inter:wght@600;700;800;900&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{fontFamily:{sans:['Cairo','Inter','sans-serif']}}}};</script>
<style>
html,body{font-family:'Cairo','Inter',sans-serif;overflow-x:hidden;max-width:100vw;background:#eef2f7;color:#0f172a}
.num{font-family:'Inter','Cairo',sans-serif;font-variant-numeric:tabular-nums;direction:ltr;display:inline-block}
.card{background:#fff;border:1px solid #dbe3ee;box-shadow:0 3px 10px -4px rgba(15,23,42,.08)}
#doc-stage{display:flex;align-items:center;justify-content:center;overflow:hidden;width:100%;flex:1;min-height:0}
#doc-wrap{position:relative;display:flex;justify-content:center;align-items:flex-start}
#print-area{width:540px;transform-origin:top center;flex-shrink:0}
@page{size:A4 portrait;margin:8mm}
@media print{
  #app,#mnav,#sb-bg,#toasts,.no-print{display:none!important}
  #modal,#doc-shell,#doc-stage,#doc-wrap{position:static!important;display:block!important;width:100%!important;height:auto!important;padding:0!important;margin:0!important;background:#fff!important;overflow:visible!important}
  #print-area{width:100%!important;transform:none!important;box-shadow:none!important;border:none!important;border-radius:0!important}
}
</style>
</head>
<body class="bg-[#eef2f7] text-slate-900 antialiased">

<div id="sb-bg" onclick="sb(0)" class="fixed inset-0 bg-slate-950/60 z-40 hidden lg:hidden"></div>

<div id="app" class="min-h-screen flex w-full max-w-full overflow-x-hidden">
  <!-- Sidebar -->
  <aside id="sb" class="fixed lg:sticky top-0 right-0 z-50 h-screen w-68 bg-[#0b1222] text-slate-200 flex flex-col transition-transform duration-200 translate-x-full lg:translate-x-0 shrink-0 border-l border-slate-800">
    <div class="p-4 border-b border-slate-800 flex items-center justify-between gap-2 bg-gradient-to-l from-blue-950/60 to-transparent">
      <div class="flex items-center gap-2.5 min-w-0">
        <div id="sb-logo" class="w-10 h-10 rounded-xl bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center text-white font-black shrink-0 overflow-hidden shadow">ERP</div>
        <div class="min-w-0">
          <h1 id="sb-name" class="text-sm font-extrabold text-white truncate">النظام المحاسبي</h1>
          <p id="sb-sub" class="text-[10px] text-blue-300 truncate num">Enterprise ERP</p>
        </div>
      </div>
      <button onclick="sb(0)" class="lg:hidden p-1.5 rounded-lg text-slate-400 hover:bg-slate-800">✕</button>
    </div>
    <nav id="sb-nav" class="flex-1 p-3 space-y-1 overflow-y-auto text-sm"></nav>
    <div class="p-3.5 border-t border-slate-800 text-[11px] text-slate-400 flex justify-between">
      <span class="num">ERP v5.0</span>
      <span class="text-emerald-400 font-bold">● حفظ محلي</span>
    </div>
  </aside>

  <!-- Workspace -->
  <div class="flex-1 flex flex-col min-w-0 w-full">
    <header class="sticky top-0 z-30 bg-white/95 backdrop-blur border-b border-slate-200 px-3.5 sm:px-6 py-2.5 flex items-center justify-between gap-2 shadow-2xs">
      <div class="flex items-center gap-2.5 min-w-0">
        <button onclick="sb(1)" class="lg:hidden p-2 rounded-xl bg-slate-100 text-slate-700 font-bold">☰</button>
        <div class="min-w-0">
          <h2 id="pg-title" class="text-base sm:text-lg font-extrabold text-slate-900 truncate">لوحة التحكم</h2>
          <p id="pg-sub" class="text-[11px] text-slate-500 truncate"></p>
        </div>
      </div>
      <div class="flex items-center gap-2 shrink-0">
        <button onclick="openOrdModal()" class="px-3.5 py-2 rounded-xl bg-blue-700 hover:bg-blue-800 text-white text-xs sm:text-sm font-bold shadow-xs cursor-pointer">+ طلبية جديدة</button>
        <button onclick="go('settings')" class="p-2 rounded-xl border border-slate-200 bg-slate-50 hover:bg-slate-100 text-slate-700 cursor-pointer" title="الإعدادات">⚙</button>
      </div>
    </header>
    <main id="main" class="flex-1 p-3.5 sm:p-6 pb-24 lg:pb-8 max-w-7xl w-full mx-auto space-y-4"></main>
  </div>
</div>

<!-- Mobile Bottom Nav -->
<nav id="mnav" class="lg:hidden fixed bottom-0 inset-x-0 z-30 bg-white/95 backdrop-blur border-t border-slate-200 px-1 py-1.5 flex justify-around text-[11px] font-bold shadow-[0_-4px_14px_rgba(0,0,0,.08)]"></nav>

<div id="modal" class="fixed inset-0 z-50 hidden items-center justify-center p-3 bg-slate-950/70 overflow-y-auto"></div>
<div id="toasts" class="fixed bottom-20 lg:bottom-5 left-4 z-[60] flex flex-col gap-2 max-w-xs w-[calc(100%-2rem)] pointer-events-none"></div>

<script>
const KEY='erp_corp_v5',
DEF={
  s:{name:'',nameEn:'',sub:'',logo:'',cur:'$',phone:'',addr:'',bank:'',iban:'',ordP:'ORD-',invP:'INV-',rvP:'RV-',purP:'PUR-',pvP:'PV-',foot:'شكراً لتعاملكم معنا — Thank you for your business',nOrd:1001,nInv:2026001,nRv:1001,nPur:3001,nPv:2001},
  cust:[],sup:[],prod:[],ord:[],pay:[],pur:[],spay:[],exp:[]
},
CATS=['إيجار','رواتب وأجور','كهرباء ومياه','شحن ونقل','صيانة','مشتريات ونثريات','أخرى'],
PAYM=['كاش','ويش ماني','بطاقة بنك','عملة رقمية'],
NAV=[
  ['dashboard','لوحة التحكم','⌂','bg-blue-600'],
  ['orders','الطلبيات والفواتير','▤','bg-blue-600'],
  ['customers','الزبائن','♟','bg-sky-600'],
  ['debts','ديون الزبائن والقبض','◈','bg-emerald-600'],
  ['suppliers','التجار والمشتريات','⇄','bg-amber-600'],
  ['warehouse','المستودع','▣','bg-teal-600'],
  ['expenses','المصاريف','◷','bg-rose-600'],
  ['settings','إعدادات الشركة','⚙','bg-slate-700']
];

let D=load(),view='dashboard',selC=null,tabC='ord',selS=null,tabS='pur',draft=[],curWA=null,
F={oq:'',os:'all',cq:'',cd:'all',sq:'',sd:'all',wq:'',ws:'all'};

function clone(o){return JSON.parse(JSON.stringify(o));}
function load(){
  try{
    const r=localStorage.getItem(KEY)||localStorage.getItem('erp_corp_v4')||localStorage.getItem('erp_corp_v3');
    if(!r)return clone(DEF);
    const p=JSON.parse(r),o=clone(DEF);
    if(p.s)o.s={...o.s,...p.s};
    o.cust=p.cust||[];o.sup=p.sup||[];o.prod=p.prod||[];
    o.ord=p.ord||p.inv||[];o.pay=p.pay||[];o.pur=p.pur||[];o.spay=p.spay||[];o.exp=p.exp||[];
    return o;
  }catch{return clone(DEF);}
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(D));}catch{toast('تعذر الحفظ المحلي','err');}}
const $=id=>document.getElementById(id),
uid=(p='id')=>p+'_'+Date.now()+'_'+Math.random().toString(36).slice(2,6),
today=()=>{const n=new Date();return new Date(n-n.getTimezoneOffset()*60000).toISOString().slice(0,10);},
esc=s=>s==null?'':String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'),
rn=n=>Math.round((Number(n)||0)*100)/100,
nf=n=>new Intl.NumberFormat('en-US',{maximumFractionDigits:2}).format(Number(n)||0),
cf=n=>`<span class="num">${nf(n)}</span>${D.s.cur?` <span class="text-[.82em] opacity-80">${esc(D.s.cur)}</span>`:''}`,
cfp=n=>D.s.cur?`${nf(n)} ${D.s.cur}`:nf(n),
bName=()=>D.s.name.trim()||'النظام المحاسبي المؤسسي',
bEn=()=>D.s.nameEn.trim()||'ENTERPRISE ERP',
byId=(arr,id)=>arr.find(x=>x.id===id)||null;

// WhatsApp Helper
function waClean(ph){
  let d=String(ph||'').replace(/[^\d]/g,'');
  if(!d)return '';
  if(d.startsWith('00'))d=d.slice(2);
  else if(d.startsWith('09')&&d.length===10)d='963'+d.slice(1);
  return d;
}
function openWA(ph,msg=''){
  const n=waClean(ph),txt=msg?`?text=${encodeURIComponent(msg)}`:'';
  window.open(n?`https://wa.me/${n}${txt}`:`https://wa.me/${txt}`,'_blank');
}
function waBtn(ph,lbl='واتساب'){
  return `<button onclick="openWA('${esc(ph||'')}')" class="px-2.5 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold cursor-pointer inline-flex items-center gap-1 shadow-2xs">💬 ${lbl}</button>`;
}

// Accounting Engine
function cStats(id){
  const c=byId(D.cust,id);if(!c)return{cnt:0,sales:0,paid:0,bal:0};
  const op=Number(c.open)||0,ords=D.ord.filter(o=>o.cid===id),pays=D.pay.filter(p=>p.cid===id);
  const sales=rn(ords.reduce((a,o)=>a+(Number(o.total)||0),0)),
  pOrd=ords.reduce((a,o)=>a+(Number(o.paid)||0),0),
  pDir=pays.reduce((a,p)=>a+(Number(p.amt)||0),0),
  paid=rn(pOrd+pDir);
  return{cnt:ords.length,sales,paid,bal:rn(op+sales-paid)};
}
function cLedger(id){
  const c=byId(D.cust,id);if(!c)return[];
  const L=[],op=Number(c.open)||0;
  if(op)L.push({dt:'—',k:0,ref:'رصيد سابق',desc:'رصيد افتتاحي مرحّل',d:op>0?op:0,c:op<0?-op:0});
  D.ord.filter(o=>o.cid===id).forEach(o=>{
    const sm=(o.items||[]).map(x=>`${x.name} (×${nf(x.qty)})`).join('، ');
    L.push({dt:o.date,k:o.ts||0,ref:o.invNum||o.num,desc:`طلبية ${o.num}${sm?' — '+sm:''}`,d:Number(o.total)||0,c:0});
    if((Number(o.paid)||0)>0)L.push({dt:o.date,k:(o.ts||0)+1,ref:o.invNum||o.num,desc:`دفعة (${o.pm||'كاش'}) مع الطلبية ${o.num}`,d:0,c:Number(o.paid)||0});
  });
  D.pay.filter(p=>p.cid===id).forEach(p=>{
    L.push({dt:p.date,k:p.ts||0,ref:p.num||'RV',desc:`دفعة (${p.m||'كاش'})${p.note?' — '+p.note:''}`,d:0,c:Number(p.amt)||0});
  });
  L.sort((a,b)=>a.k-b.k);
  let r=0;return L.map(x=>{r=rn(r+x.d-x.c);return{...x,r};});
}
function sStats(id){
  const s=byId(D.sup,id);if(!s)return{cnt:0,tot:0,paid:0,bal:0};
  const op=Number(s.open)||0,purs=D.pur.filter(p=>p.sid===id),pays=D.spay.filter(p=>p.sid===id);
  const tot=rn(purs.reduce((a,p)=>a+(Number(p.total)||0),0)),
  paid=rn(pays.reduce((a,p)=>a+(Number(p.amt)||0),0));
  return{cnt:purs.length,tot,paid,bal:rn(op+tot-paid)};
}
function sLedger(id){
  const s=byId(D.sup,id);if(!s)return[];
  const L=[],op=Number(s.open)||0;
  if(op)L.push({dt:'—',k:0,ref:'رصيد سابق',desc:'رصيد افتتاحي للتاجر',cr:op>0?op:0,dr:op<0?-op:0});
  D.pur.filter(p=>p.sid===id).forEach(p=>{
    const sm=(p.items||[]).map(x=>`${x.name} (×${nf(x.qty)})`).join('، ');
    L.push({dt:p.date,k:p.ts||0,ref:p.num,desc:`سحب بضاعة${sm?' — '+sm:''}`,cr:Number(p.total)||0,dr:0});
  });
  D.spay.filter(p=>p.sid===id).forEach(p=>{
    L.push({dt:p.date,k:p.ts||0,ref:p.num||'PV',desc:`دفعة للتاجر (${p.m||'كاش'})${p.note?' — '+p.note:''}`,cr:0,dr:Number(p.amt)||0});
  });
  L.sort((a,b)=>a.k-b.k);
  let r=0;return L.map(x=>{r=rn(r+x.cr-x.dr);return{...x,r};});
}
function dashStats(){
  const sales=rn(D.ord.reduce((a,o)=>a+(Number(o.total)||0),0)),
  coll=rn(D.ord.reduce((a,o)=>a+(Number(o.paid)||0),0)+D.pay.reduce((a,p)=>a+(Number(p.amt)||0),0)),
  totPur=rn(D.pur.reduce((a,p)=>a+(Number(p.total)||0),0)),
  paidSup=rn(D.spay.reduce((a,p)=>a+(Number(p.amt)||0),0)),
  exp=rn(D.exp.reduce((a,e)=>a+(Number(e.amt)||0),0));
  let gp=0;
  D.ord.forEach(o=>{
    const cost=(o.items||[]).reduce((a,x)=>a+(Number(x.cost)||0)*(Number(x.qty)||0),0);
    gp+=(Number(o.total)||0)-cost;
  });
  const debtors=D.cust.map(c=>({...c,...cStats(c.id)})).filter(x=>x.bal>0).sort((a,b)=>b.bal-a.bal),
  creditors=D.sup.map(s=>({...s,...sStats(s.id)})).filter(x=>x.bal>0).sort((a,b)=>b.bal-a.bal),
  wCost=rn(D.prod.reduce((a,p)=>a+Math.max(0,Number(p.qty)||0)*(Number(p.cost)||0),0)),
  wSell=rn(D.prod.reduce((a,p)=>a+Math.max(0,Number(p.qty)||0)*(Number(p.sell)||0),0)),
  low=D.prod.filter(p=>(Number(p.qty)||0)<=(Number(p.min)||0));
  return{sales,coll,totPur,paidSup,exp,profit:rn(gp-exp),cash:rn(coll-exp-paidSup),debtors,debts:rn(debtors.reduce((a,x)=>a+x.bal,0)),creditors,payables:rn(creditors.reduce((a,x)=>a+x.bal,0)),wCost,wSell,low};
}
const stBadge=(s,pm)=>s==='paid'?[`نقدي${pm?' • '+pm:''}`,'bg-emerald-100 text-emerald-800 border-emerald-300']:s==='partial'?[`جزئي${pm?' • '+pm:''}`,'bg-amber-100 text-amber-900 border-amber-300']:['دين (آجل)','bg-rose-100 text-rose-800 border-rose-300'];
const skBadge=p=>{const q=Number(p.qty)||0,m=Number(p.min)||0;return q<=0?['out','نافذ','bg-rose-100 text-rose-800 border-rose-300']:q<=m?['low','منخفض','bg-amber-100 text-amber-900 border-amber-300']:['ok','متوفر','bg-teal-100 text-teal-800 border-teal-300'];};

// UI Chrome
function sb(open){$('sb').classList.toggle('translate-x-full',!open);$('sb-bg').classList.toggle('hidden',!open);}
function toast(msg,t='ok'){
  const c=$('toasts'),el=document.createElement('div');
  const bg=t==='err'?'bg-rose-600':t==='warn'?'bg-amber-600':t==='info'?'bg-blue-600':'bg-[#0b1222]';
  el.className=`pointer-events-auto px-4 py-2.5 rounded-xl text-white text-xs sm:text-sm font-bold shadow-xl ${bg}`;
  el.textContent=msg;c.appendChild(el);setTimeout(()=>el.remove(),2800);
}
function modal(html,w='max-w-lg'){
  const r=$('modal');
  r.className='fixed inset-0 z-50 flex items-center justify-center p-3 bg-slate-950/70 overflow-y-auto';
  r.innerHTML=`<div class="w-full ${w} bg-white rounded-2xl shadow-2xl border border-slate-200 overflow-hidden my-auto" onclick="event.stopPropagation()">${html}</div>`;
  r.onclick=closeM;
}
function closeM(){const r=$('modal');r.className='fixed inset-0 z-50 hidden';r.innerHTML='';curWA=null;}
function confirmM(title,msg,fn,cls='bg-rose-600'){
  window._cf=fn;
  modal(`<div class="p-5 space-y-4"><h3 class="text-base font-extrabold">${esc(title)}</h3><p class="text-sm text-slate-600">${esc(msg)}</p><div class="flex justify-end gap-2 pt-2 border-t"><button onclick="closeM()" class="px-4 py-2 rounded-xl border text-sm font-bold cursor-pointer">إلغاء</button><button onclick="closeM();window._cf&&window._cf()" class="px-4 py-2 rounded-xl text-white text-sm font-bold cursor-pointer ${cls}">تأكيد</button></div></div>`,'max-w-sm');
}

// Fixed-Viewport Screenshot Document Modal
function docModal(title,bodyHtml,waInfo=null,barBg='bg-[#0b1222]'){
  curWA=waInfo;
  const r=$('modal');
  r.className='fixed inset-0 z-50 flex flex-col bg-slate-900 overflow-hidden';
  r.onclick=null;
  r.innerHTML=`
    <div id="doc-shell" class="w-full h-[100dvh] flex flex-col overflow-hidden">
      <div id="doc-bar" class="no-print h-12 px-2.5 sm:px-5 ${barBg} text-white border-b border-white/10 flex items-center justify-between gap-1.5 shrink-0">
        <span class="font-bold text-xs truncate">● ${esc(title)}</span>
        <div class="flex items-center gap-1.5 shrink-0">
          ${waInfo?`<button onclick="curWA&&openWA(curWA.ph,curWA.msg)" class="px-2.5 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white text-[11px] font-bold cursor-pointer">💬 واتساب</button>`:''}
          <button onclick="ssMode(1)" class="px-2.5 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white text-[11px] font-bold cursor-pointer">وضع اللقطة</button>
          <button onclick="window.print()" class="px-2.5 py-1.5 rounded-lg bg-blue-600 hover:bg-blue-500 text-white text-[11px] font-bold cursor-pointer">طباعة</button>
          <button onclick="closeM()" class="px-2.5 py-1.5 rounded-lg bg-slate-800 text-slate-200 text-[11px] font-bold cursor-pointer">إغلاق</button>
        </div>
      </div>
      <div id="doc-stage" onclick="if($('doc-bar')?.classList.contains('hidden'))ssMode(0)" class="bg-slate-300/90 p-2">
        <div id="doc-wrap"><div id="print-area" class="bg-white text-slate-900 rounded-xl shadow-2xl border border-slate-300 overflow-hidden">${bodyHtml}</div></div>
      </div>
    </div>`;
  requestAnimationFrame(()=>{fitDoc();setTimeout(fitDoc,70);});
}
function ssMode(hide){const b=$('doc-bar');if(!b)return;b.classList.toggle('hidden',!!hide);if(hide)toast('اضغط بأي مكان لإظهار الشريط','info');requestAnimationFrame(fitDoc);}
function fitDoc(){
  const st=$('doc-stage'),sh=$('print-area'),wr=$('doc-wrap');if(!st||!sh||!wr)return;
  sh.style.transform='none';wr.style.width='auto';wr.style.height='auto';
  const aw=Math.max(180,st.clientWidth-14),ah=Math.max(180,st.clientHeight-14),nw=sh.offsetWidth,nh=sh.offsetHeight;
  if(!nw||!nh)return;
  const sc=Math.min(1.12,aw/nw,ah/nh);
  sh.style.transform=`scale(${sc})`;wr.style.width=Math.ceil(nw*sc)+'px';wr.style.height=Math.ceil(nh*sc)+'px';
}
window.addEventListener('resize',()=>{if($('doc-stage'))fitDoc();});

// Distinct Color-Coded Document Header
function docHead(ar,en,meta,headerBg,badgeBg){
  const s=D.s;
  return `
    <div class="${headerBg} text-white px-4 py-3.5 flex justify-between items-start gap-3">
      <div class="flex items-start gap-2.5 min-w-0">
        ${s.logo?`<img src="${s.logo}" class="w-11 h-11 object-contain rounded-lg bg-white p-1 shrink-0 shadow"/>`:`<div class="w-10 h-10 rounded-lg bg-white/15 border border-white/25 text-white flex items-center justify-center font-black text-xs shrink-0">ERP</div>`}
        <div class="min-w-0">
          <div class="text-sm font-black truncate">${esc(bName())}</div>
          <div class="text-[9px] font-bold text-white/75 uppercase num">${esc(bEn())}</div>
          <div class="text-[9px] text-white/80 flex flex-wrap gap-x-2 mt-0.5">
            ${s.phone?`<span class="num">${esc(s.phone)}</span>`:''}
            ${s.addr?`<span>${esc(s.addr)}</span>`:''}
          </div>
        </div>
      </div>
      <div class="min-w-[165px] ${badgeBg} border border-white/20 rounded-lg p-2 text-right shrink-0">
        <div class="border-b border-white/15 pb-1 mb-1">
          <div class="text-xs font-black text-white">${esc(ar)}</div>
          <div class="text-[8px] font-extrabold text-white/75 uppercase num">${esc(en)}</div>
        </div>
        <div class="space-y-0.5 text-[10px] text-white/95">${meta}</div>
      </div>
    </div>`;
}

// Navigation
function go(v){view=v;sb(0);window.scrollTo(0,0);render();}
function openCust(id,t='ord'){selC=id;tabC=t;go('cdetail');}
function openSup(id,t='pur'){selS=id;tabS=t;go('sdetail');}

function renderChrome(){
  const st=dashStats(),hl=view==='cdetail'?'customers':view==='sdetail'?'suppliers':view;
  document.title=bName();
  $('sb-name').textContent=bName();
  $('sb-sub').textContent=D.s.sub||'Enterprise ERP';
  $('pg-sub').textContent=D.s.name?`${bName()} • العملة: ${D.s.cur}`:'أضف اسم الشركة والشعار من الإعدادات';
  $('sb-logo').innerHTML=D.s.logo?`<img src="${D.s.logo}" class="w-full h-full object-contain bg-white p-0.5"/>`:'ERP';
  const titles={dashboard:'لوحة التحكم',orders:'الطلبيات والفواتير',customers:'الزبائن',cdetail:'ملف الزبون',debts:'ديون الزبائن والقبض',suppliers:'التجار والمشتريات',sdetail:'ملف التاجر',warehouse:'المستودع',expenses:'المصاريف',settings:'إعدادات الشركة'};
  $('pg-title').textContent=titles[view]||'النظام المحاسبي';

      :k==='warehouse'&&st.low.length?`<span class="num text-[10px] bg-amber-500/25 text-amber-200 px-1.5 rounded-full">${st.low.length}</span>`:'';
    return `<button onclick="go('${k}')" class="w-full flex items-center justify-between px-3 py-2.5 rounded-xl font-bold transition cursor-pointer ${act?ac+' text-white shadow':'text-slate-300 hover:bg-slate-800'}"><span class="flex items-center gap-2.5"><span>${ic}</span><span>${lbl}</span></span>${badge}</button>`;
  }).join('');

  const mItems=[['dashboard','الرئيسية','⌂','text-blue-700 bg-blue-50'],['orders','الطلبيات','▤','text-blue-700 bg-blue-50'],['customers','الزبائن','♟','text-sky-700 bg-sky-50'],['suppliers','التجار','⇄','text-amber-700 bg-amber-50']];
  $('mnav').innerHTML=mItems.map(([k,l,ic,ac])=>`<button onclick="go('${k}')" class="flex flex-col items-center px-2.5 py-1 rounded-xl ${hl===k?ac:'text-slate-500'}"><span class="text-base leading-none">${ic}</span><span>${l}</span></button>`).join('')

}

function render(){
  renderChrome();
  const m=$('main');
  if(view==='dashboard')m.innerHTML=vDash();
  else if(view==='orders'){m.innerHTML=vOrdShell();rOrdList();}
  else if(view==='customers'){m.innerHTML=vCustShell();rCustList();}
  else if(view==='cdetail')m.innerHTML=vCustDet();
  else if(view==='debts')m.innerHTML=vDebts();
  else if(view==='suppliers'){m.innerHTML=vSupShell();rSupList();}
  else if(view==='sdetail')m.innerHTML=vSupDet();
  else if(view==='warehouse'){m.innerHTML=vWhShell();rWhList();}
  else if(view==='expenses'){m.innerHTML=vExpShell();rExpList();}
  else if(view==='settings')m.innerHTML=vSettings();
}

function rOrdList(){

    if(F.os!=='all'&&o.st!==F.os)return false;

    return true;
  }).sort((a,b)=>(b.ts||0)-(a.ts||0));
  if(!list.length){el.innerHTML='<div class="card rounded-2xl p-10 text-center text-slate-400 text-sm">لا توجد طلبيات</div>';return;}
  el.innerHTML=`<div class="space-y-2.5">${list.map(o=>{
    const[lb,cl]=stBadge(o.st,o.pm),sm=(o.items||[]).map(x=>`${x.name} (×${nf(x.qty)})`).join('، ');

          <span class="text-xs text-slate-400 num">${esc(o.date)}</span>
        </div>
        <div class="text-sm font-bold">${o.cid?`<button onclick="openCust('${o.cid}')" class="text-blue-700 hover:underline cursor-pointer">${esc(o.cname)}</button>`:'زبون نقدي'}</div>
        <div class="text-xs text-slate-500 truncate">${esc(sm)}</div>
      </div>
      <div class="flex flex-wrap items-center justify-between sm:justify-end gap-3 shrink-0">
        <div class="flex gap-3 text-xs">
          <div><span class="text-slate-400 block">الإجمالي</span><strong>${cf(o.total)}</strong></div>
          <div><span class="text-slate-400 block">المدفوع</span><strong class="text-emerald-700">${cf(o.paid)}</strong></div>
          <div><span class="text-slate-400 block">المتبقي</span><strong class="${o.rem>0?'text-rose-600':'text-slate-400'}">${cf(o.rem)}</strong></div>
        </div>
        <div class="flex gap-1.5">
          <button onclick="issueOrPrevInv('${o.id}')" class="px-3 py-1.5 rounded-lg bg-blue-700 text-white text-xs font-bold cursor-pointer">${o.invNum?'الفاتورة':'إصدار فاتورة'}</button>
          <button onclick="delOrd('${o.id}')" class="px-2.5 py-1.5 rounded-lg bg-rose-50 text-rose-700 text-xs font-bold cursor-pointer">حذف</button>
        </div>
      </div>
    </div>`;
  }).join('')}</div>`;
}
function openOrdModal(preC=''){

  modal(`
    <div class="p-4 border-b flex justify-between items-center bg-blue-700 text-white"><h3 class="font-extrabold">طلبية جديدة (<span class="num">${esc(D.s.ordP+D.s.nOrd)}</span>)</h3><button onclick="closeM()" class="p-1 cursor-pointer">✕</button></div>

      <div id="rows" class="space-y-2"></div>
      <div class="bg-blue-50/70 p-3 rounded-xl border border-blue-200 space-y-2.5">
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
          <div><label class="text-[11px] font-bold text-slate-600">نوع الدفع</label>
            <select id="ost" onchange="calcOrd()" class="w-full px-2.5 py-2 rounded-lg border bg-white text-xs font-bold">

              <option value="partial">دفعة جزئية + دين</option>

            <select id="opm" class="w-full px-2.5 py-2 rounded-lg border bg-white text-xs font-bold text-blue-800">

        </div>
        <div class="grid grid-cols-3 gap-2 text-center text-xs pt-2 border-t border-blue-200">
          <div><span class="text-slate-500 block">الإجمالي</span><strong id="otot" class="text-sm">0</strong></div>
          <div><span class="text-slate-500 block">المدفوع</span><strong id="ospd" class="text-sm text-emerald-700">0</strong></div>
          <div><span class="text-slate-500 block">المتبقي (دين)</span><strong id="orem" class="text-sm text-rose-600">0</strong></div>
        </div>

      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">

    </form>`,'max-w-2xl');
  rRows('ord');calcOrd();

function rRows(mode){
  const el=$('rows');if(!el)return;
  el.innerHTML=draft.map(r=>{
    const p=byId(D.prod,r.pid),stk=p?Number(p.qty)||0:0,over=mode==='ord'&&r.qty>stk;
    return `
    <div class="grid grid-cols-12 gap-1.5 items-center bg-slate-50 p-2 rounded-xl border ${over?'border-rose-400 bg-rose-50/50':'border-slate-200'}">
      <div class="col-span-12 sm:col-span-5">
        <select onchange="updRow('${r.rid}','pid',this.value,'${mode}')" class="w-full px-2 py-1.5 rounded-lg border bg-white text-xs font-bold">
          ${D.prod.map(x=>`<option value="${x.id}" ${x.id===r.pid?'selected':''}>${esc(x.name)} — المتوفر: ${nf(x.qty)}</option>`).join('')}
        </select>
        <div class="text-[10px] mt-0.5 px-1 font-bold ${over?'text-rose-600':'text-teal-700'}">
          ${mode==='ord'?(over?`⚠ المطلوب أكبر من المتوفر (${nf(stk)})`:`المتبقي بالمستودع: ${nf(stk)}`):`الكمية الحالية بالمستودع: ${nf(stk)}`}
        </div>
      </div>
      <input type="number" min="0.01" step="any" value="${r.qty}" oninput="updRow('${r.rid}','qty',this.value,'${mode}')" placeholder="كمية" class="col-span-4 sm:col-span-2 px-2 py-1.5 rounded-lg border bg-white text-xs text-center font-bold num"/>
      <input type="number" min="0" step="any" value="${r.pr}" oninput="updRow('${r.rid}','pr',this.value,'${mode}')" placeholder="السعر" class="col-span-4 sm:col-span-2 px-2 py-1.5 rounded-lg border bg-white text-xs text-center font-bold num"/>
      <div id="lt-${r.rid}" class="col-span-3 sm:col-span-2 text-center text-xs font-black num">${nf(r.qty*r.pr)}</div>
      <div class="col-span-1 text-left">${draft.length>1?`<button type="button" onclick="draft=draft.filter(x=>x.rid!=='${r.rid}');rRows('${mode}');${mode==='ord'?'calcOrd()':'calcPur()'}" class="text-rose-600 font-bold px-1 cursor-pointer">✕</button>`:''}</div>
    </div>`;
  }).join('');
}
function addRow(mode){
  const p=mode==='ord'?(D.prod.find(x=>(Number(x.qty)||0)>0)||D.prod[0]):D.prod[0];
  if(!p)return;
  draft.push({rid:uid('r'),pid:p.id,qty:1,pr:Number(mode==='ord'?p.sell:p.cost)||0});
  rRows(mode);mode==='ord'?calcOrd():calcPur();
}
function updRow(rid,k,v,mode){
  const r=draft.find(x=>x.rid===rid);if(!r)return;
  if(k==='pid'){r.pid=v;const p=byId(D.prod,v);r.pr=p?Number(mode==='ord'?p.sell:p.cost)||0:0;rRows(mode);}
  else{r[k]=Number(v)||0;if(k==='qty'&&mode==='ord')rRows(mode);else{const el=$('lt-'+rid);if(el)el.textContent=nf(r.qty*r.pr);}}
  mode==='ord'?calcOrd():calcPur();
}
function calcOrd(man=0){
  const tot=rn(draft.reduce((a,r)=>a+r.qty*r.pr,0)),st=$('ost'),pe=$('opd');if(!st||!pe)return;
  if(!$('oc').value&&st.value!=='paid'){toast('الدين أو الدفعة الجزئية يتطلب اختيار زبون','warn');st.value='paid';}
  let pd=Number(pe.value)||0;
  if(!man){pd=st.value==='paid'?tot:st.value==='unpaid'?0:(pd>=tot?0:pd);pe.value=pd;}
  else{pd=Math.max(0,Math.min(tot,pd));st.value=pd>=tot&&tot>0?'paid':pd<=0&&tot>0?'unpaid':'partial';}
  $('pm-wrap').classList.toggle('hidden',st.value==='unpaid');
  $('pd-wrap').classList.toggle('opacity-50',st.value!=='partial');
  pe.readOnly=(st.value!=='partial');
  $('otot').innerHTML=cf(tot);$('ospd').innerHTML=cf(pd);$('orem').innerHTML=cf(rn(tot-pd));
}
function saveOrd(e){
  e.preventDefault();
  const cid=$('oc').value||null,dt=$('od').value||today(),stVal=$('ost').value,pm=stVal==='unpaid'?'':$('opm').value;
  const req={},items=[];
  for(const r of draft){
    const p=byId(D.prod,r.pid);
    if(!p||r.qty<=0){toast('اختر صنفاً صحيحاً من المستودع','err');return;}
    req[p.id]=(req[p.id]||0)+r.qty;
    items.push({pid:p.id,name:p.name,qty:r.qty,pr:r.pr,cost:Number(p.cost)||0,tot:rn(r.qty*r.pr)});
  }
  for(const[pid,need]of Object.entries(req)){const p=byId(D.prod,pid);if(p&&(Number(p.qty)||0)<need){toast(`المتوفر من "${p.name}" هو ${nf(p.qty)} فقط`,'err');return;}}
  const tot=rn(items.reduce((a,x)=>a+x.tot,0)),pd=stVal==='paid'?tot:stVal==='unpaid'?0:Math.max(0,Math.min(tot,Number($('opd').value)||0)),rem=rn(tot-pd);
  if(rem>0&&!cid){toast('اختر زبوناً للطلبية الآجلة','err');return;}
  for(const[pid,need]of Object.entries(req)){const p=byId(D.prod,pid);if(p)p.qty=rn((Number(p.qty)||0)-need);}
  const c=cid?byId(D.cust,cid):null,num=D.s.ordP+D.s.nOrd++,auto=$('oauto').checked,invNum=auto?(D.s.invP+D.s.nInv++):null;
  const ord={id:uid('ord'),num,invNum,date:dt,cid,cname:c?c.name:'زبون نقدي',cph:c?.phone||'',items,total:tot,paid:pd,rem,st:rem<=0?'paid':pd>0?'partial':'unpaid',pm,note:$('onote').value.trim(),ts:Date.now()};
  D.ord.push(ord);save();closeM();render();
  toast(auto?`تم حفظ الطلبية ${num} وإصدار الفاتورة ${invNum}`:`تم حفظ الطلبية ${num}`);
  if(auto)prevInv(ord.id);
}
function issueOrPrevInv(id){
  const o=byId(D.ord,id);if(!o)return;
  if(!o.invNum){o.invNum=D.s.invP+D.s.nInv++;save();render();toast('تم إصدار الفاتورة '+o.invNum);}
  prevInv(id);
}
function delOrd(id){
  const o=byId(D.ord,id);if(!o)return;
  confirmM('حذف الطلبية '+o.num,'سيتم حذف الطلبية وفاتورتها وإعادة الكميات للمستودع.',()=>{

function openPayModal(preC=''){
  if(!D.cust.length){toast('أضف زبوناً أولاً','warn');return;}
  const cid=preC||D.cust[0].id,bal=Math.max(0,cStats(cid).bal);
  modal(`<div class="p-4 border-b flex justify-between bg-emerald-700 text-white"><h3 class="font-extrabold">إيصال قبض (<span class="num">${esc(D.s.rvP+D.s.nRv)}</span>)</h3><button onclick="closeM()" class="cursor-pointer">✕</button></div>

function savePay(e){
  e.preventDefault();
  const cid=$('pc').value,amt=Number($('pa').value)||0;if(!cid||amt<=0)return;
  const num=D.s.rvP+D.s.nRv++,p={id:uid('rv'),num,cid,cname:byId(D.cust,cid)?.name||'',amt,date:$('pd').value||today(),m:$('pm').value,note:$('pn').value.trim(),ts:Date.now()};
  D.pay.push(p);save();closeM();render();toast('تم إصدار الإيصال '+num);prevRv(p.id);
}
function delPay(id){confirmM('حذف الإيصال','سيُعاد المبلغ لدين الزبون.',()=>{D.pay=D.pay.filter(x=>x.id!==id);save();render();toast('تم الحذف');});}

function saveSup(e,id){

  save();closeM();render();toast('تم حفظ التاجر');
}

function calcPur(){
  const tot=rn(draft.reduce((a,r)=>a+r.qty*r.pr,0)),pd=Math.max(0,Math.min(tot,Number($('ppd')?.value)||0));
  $('ptot').innerHTML=cf(tot);$('pspd').innerHTML=cf(pd);$('prem').innerHTML=cf(rn(tot-pd));
}
function savePur(e){
  e.preventDefault();
  const sid=$('ps').value,sup=byId(D.sup,sid),dt=$('pdt').value||today();if(!sup)return;
  const items=[];
  for(const r of draft){
    const p=byId(D.prod,r.pid);if(!p||r.qty<=0){toast('تحقق من الأصناف والكميات','err');return;}
    items.push({pid:p.id,name:p.name,qty:r.qty,pr:r.pr,tot:rn(r.qty*r.pr)});
    p.qty=rn((Number(p.qty)||0)+r.qty);if(r.pr>0)p.cost=r.pr;
  }
  const tot=rn(items.reduce((a,x)=>a+x.tot,0)),pd=Math.max(0,Math.min(tot,Number($('ppd').value)||0)),num=D.s.purP+D.s.nPur++;
  D.pur.push({id:uid('pur'),num,date:dt,sid,sname:sup.name,items,total:tot,note:$('pnt').value.trim(),ts:Date.now()});
  if(pd>0){D.spay.push({id:uid('pv'),num:D.s.pvP+D.s.nPv++,sid,sname:sup.name,amt:pd,date:dt,m:$('ppm').value,note:'دفعة فورية مع '+num,ts:Date.now()+1});}
  save();closeM();render();toast('تم تسجيل سحب البضاعة '+num);
}
function delPur(id){
  const p=byId(D.pur,id);if(!p)return;
  confirmM('حذف فاتورة الشراء','سيتم خصم كمياتها من المستودع وتحديث حساب التاجر.',()=>{
    (p.items||[]).forEach(x=>{const pr=byId(D.prod,x.pid);if(pr)pr.qty=Math.max(0,rn((Number(pr.qty)||0)-(Number(x.qty)||0)));});
    D.pur=D.pur.filter(x=>x.id!==id);save();render();toast('تم الحذف');
  });
}

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>النظام المحاسبي المؤسسي</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800;900&family=Inter:wght@600;700;800;900&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{fontFamily:{sans:['Cairo','Inter','sans-serif']}}}};</script>
<style>
html,body{font-family:'Cairo','Inter',sans-serif;overflow-x:hidden;max-width:100vw;background:#eef2f7;color:#0f172a}
.num{font-family:'Inter','Cairo',sans-serif;font-variant-numeric:tabular-nums;direction:ltr;display:inline-block}
.card{background:#fff;border:1px solid #dbe3ee;box-shadow:0 3px 10px -4px rgba(15,23,42,.08)}
#doc-stage{display:flex;align-items:center;justify-content:center;overflow:hidden;width:100%;flex:1;min-height:0}
#doc-wrap{position:relative;display:flex;justify-content:center;align-items:flex-start}
#print-area{width:560px;transform-origin:top center;flex-shrink:0}
@page{size:A4 portrait;margin:8mm}
@media print{
  #app,#mnav,#sb-bg,#toasts,#auth-screen,.no-print{display:none!important}
  #modal,#doc-shell,#doc-stage,#doc-wrap{position:static!important;display:block!important;width:100%!important;height:auto!important;padding:0!important;margin:0!important;background:#fff!important;overflow:visible!important}
  #print-area{width:100%!important;transform:none!important;box-shadow:none!important;border:none!important;border-radius:0!important}
}
</style>
</head>
<body class="bg-[#eef2f7] text-slate-900 antialiased">

<div id="auth-screen" class="hidden fixed inset-0 z-[70] bg-gradient-to-br from-[#0b1222] via-slate-900 to-blue-950 flex items-center justify-center p-4 overflow-y-auto">
  <div class="w-full max-w-sm bg-white rounded-3xl shadow-2xl border border-slate-200 overflow-hidden my-auto">
    <div class="bg-gradient-to-l from-[#0f172a] via-blue-900 to-blue-700 text-white p-6 text-center space-y-2">
      <div id="auth-logo" class="w-16 h-16 mx-auto rounded-2xl bg-white/15 border border-white/25 flex items-center justify-center font-black text-xl overflow-hidden shadow">ERP</div>
      <h1 id="auth-name" class="text-lg font-black">النظام المحاسبي المؤسسي</h1>
      <p class="text-xs text-blue-200">تسجيل دخول الإدارة والموظفين</p>
    </div>
    <form onsubmit="doLogin(event)" class="p-6 space-y-4">
      <div>
        <label class="text-xs font-bold text-slate-600 block mb-1">اسم المستخدم</label>
        <input id="lg-u" required autocomplete="username" placeholder="أدخل اسم المستخدم" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 bg-slate-50 focus:bg-white focus:border-blue-600 outline-none text-sm font-bold"/>
      </div>
      <div>
        <label class="text-xs font-bold text-slate-600 block mb-1">كلمة السر</label>
        <div class="relative">
          <input id="lg-p" type="password" required autocomplete="current-password" placeholder="أدخل كلمة السر" class="w-full px-3.5 py-2.5 pl-14 rounded-xl border border-slate-300 bg-slate-50 focus:bg-white focus:border-blue-600 outline-none text-sm font-bold num"/>
          <button type="button" onclick="const i=$('lg-p');i.type=i.type==='password'?'text':'password';this.textContent=i.type==='password'?'إظهار':'إخفاء'" class="absolute left-2 top-1/2 -translate-y-1/2 text-[11px] font-bold text-slate-500 hover:text-slate-800 px-1.5 py-1 cursor-pointer">إظهار</button>
        </div>
      </div>
      <div id="lg-err" class="hidden text-xs font-bold text-rose-700 bg-rose-50 border border-rose-200 rounded-xl p-2.5 text-center"></div>
      <button class="w-full py-3 rounded-xl bg-blue-700 hover:bg-blue-800 text-white text-sm font-black shadow cursor-pointer">تسجيل الدخول</button>
    </form>
  </div>
</div>

<div id="sb-bg" onclick="sb(0)" class="fixed inset-0 bg-slate-950/60 z-40 hidden lg:hidden"></div>

<div id="app" class="hidden min-h-screen flex w-full max-w-full overflow-x-hidden">
  <aside id="sb" class="fixed lg:sticky top-0 right-0 z-50 h-screen w-64 bg-[#0b1222] text-slate-200 flex flex-col transition-transform duration-200 translate-x-full lg:translate-x-0 shrink-0 border-l border-slate-800">
    <div class="p-4 border-b border-slate-800 flex items-center justify-between gap-2 bg-gradient-to-l from-blue-950/60 to-transparent">
      <div class="flex items-center gap-2.5 min-w-0">
        <div id="sb-logo" class="w-10 h-10 rounded-xl bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center text-white font-black shrink-0 overflow-hidden shadow">ERP</div>
        <div class="min-w-0">
          <h1 id="sb-name" class="text-sm font-extrabold text-white truncate">النظام المحاسبي</h1>
          <p id="sb-sub" class="text-[10px] text-blue-300 truncate num">Enterprise ERP</p>
        </div>
      </div>
      <button onclick="sb(0)" class="lg:hidden px-2 py-1 rounded-lg text-slate-400 hover:bg-slate-800 font-bold">X</button>
    </div>

    <div class="px-3.5 py-2.5 bg-slate-900/80 border-b border-slate-800 flex items-center justify-between gap-2">
      <div class="min-w-0">
        <div id="sb-user" class="text-xs font-extrabold text-white truncate">-</div>
        <div id="sb-role" class="text-[10px] text-emerald-400 font-bold truncate">-</div>
      </div>
      <button onclick="doLogout()" class="px-2.5 py-1 rounded-lg bg-rose-600/20 hover:bg-rose-600 text-rose-300 hover:text-white text-[10px] font-bold cursor-pointer shrink-0">خروج</button>
    </div>

    <nav id="sb-nav" class="flex-1 p-3 space-y-1 overflow-y-auto text-sm"></nav>
    <div class="p-3.5 border-t border-slate-800 text-[11px] text-slate-400 flex justify-between">
      <span class="num">ERP v6.0</span>
      <span class="text-emerald-400 font-bold">• حفظ محلي</span>
    </div>
  </aside>

  <div class="flex-1 flex flex-col min-w-0 w-full">
    <header class="sticky top-0 z-30 bg-white/95 backdrop-blur border-b border-slate-200 px-3.5 sm:px-6 py-2.5 flex items-center justify-between gap-2 shadow-sm">
      <div class="flex items-center gap-2.5 min-w-0">
        <button onclick="sb(1)" class="lg:hidden px-2.5 py-1.5 rounded-xl bg-slate-100 text-slate-700 font-black text-sm">القائمة</button>
        <div class="min-w-0">
          <h2 id="pg-title" class="text-base sm:text-lg font-extrabold text-slate-900 truncate">لوحة التحكم</h2>
          <p id="pg-sub" class="text-[11px] text-slate-500 truncate"></p>
        </div>
      </div>
      <div class="flex items-center gap-1.5 sm:gap-2 shrink-0">
        <button id="hd-bell" onclick="tabAdm='logs';go('admin')" class="hidden relative px-2.5 py-2 rounded-xl border border-slate-200 bg-slate-50 hover:bg-slate-100 text-slate-700 text-xs font-extrabold cursor-pointer" title="الإشعارات">
          <span>تنبيه</span>
          <span id="hd-bell-cnt" class="hidden absolute -top-1.5 -left-1.5 min-w-[18px] h-[18px] px-1 rounded-full bg-rose-600 text-white text-[10px] font-black flex items-center justify-center num">0</span>
        </button>
        <button onclick="openOrdModal()" class="px-3 py-2 rounded-xl bg-blue-700 hover:bg-blue-800 text-white text-xs sm:text-sm font-bold shadow-sm cursor-pointer">+ طلبية جديدة</button>
        <button id="hd-set" onclick="go('settings')" class="hidden px-2.5 py-2 rounded-xl border border-slate-200 bg-slate-50 hover:bg-slate-100 text-slate-700 text-xs font-extrabold cursor-pointer" title="الإعدادات">ضبط</button>
      </div>
    </header>
    <main id="main" class="flex-1 p-3.5 sm:p-6 pb-24 lg:pb-8 max-w-7xl w-full mx-auto space-y-4"></main>
  </div>
</div>

<nav id="mnav" class="hidden lg:hidden fixed bottom-0 inset-x-0 z-30 bg-white/95 backdrop-blur border-t border-slate-200 px-1 py-1.5 flex justify-around text-[11px] font-bold shadow-[0_-4px_14px_rgba(0,0,0,.08)]"></nav>

<div id="modal" class="fixed inset-0 z-50 hidden items-start sm:items-center justify-center p-2.5 sm:p-4 pt-4 bg-slate-950/70 overflow-y-auto"></div>
<div id="toasts" class="fixed bottom-20 lg:bottom-5 left-4 z-[80] flex flex-col gap-2 max-w-xs w-[calc(100%-2rem)] pointer-events-none"></div>

<script>
const KEY='erp_corp_v5',SESS_KEY='erp_sess_v6',
DEF_ADMIN={id:'u_admin',name:'ابو حسام',pass:'70503468',role:'admin',title:'الإدارة العامة',ts:0},
DEF={
  s:{name:'',nameEn:'',sub:'',logo:'',cur:'$',phone:'',addr:'',bank:'',iban:'',ordP:'ORD-',invP:'INV-',rvP:'RV-',purP:'PUR-',pvP:'PV-',foot:'شكراً لتعاملكم معنا - Thank you for your business',nOrd:1001,nInv:2026001,nRv:1001,nPur:3001,nPv:2001},
  users:[DEF_ADMIN],logs:[],
  cust:[],sup:[],prod:[],ord:[],invs:[],pay:[],pur:[],spay:[],exp:[]
},
CATS=['إيجار','رواتب وأجور','كهرباء ومياه','شحن ونقل','صيانة','مشتريات ونثريات','أخرى'],
PAYM=['كاش','ويش ماني','بطاقة بنك','عملة رقمية'],
NAV=[
  ['dashboard','لوحة التحكم','•','bg-blue-600',false],
  ['orders','الطلبيات والفواتير','•','bg-blue-600',false],
  ['customers','الزبائن','•','bg-sky-600',false],
  ['debts','ديون الزبائن والقبض','•','bg-emerald-600',false],
  ['suppliers','التجار والمشتريات','•','bg-amber-600',false],
  ['warehouse','المستودع','•','bg-teal-600',false],
  ['expenses','المصاريف','•','bg-rose-600',false],
  ['admin','الإدارة والموظفين','•','bg-indigo-700',true],
  ['settings','إعدادات الشركة','•','bg-slate-700',true]
];

let D=load(),view='dashboard',selC=null,tabC='inv',selS=null,tabS='pur',tabOrd='ord',tabWh='items',tabAdm='logs',
draft=[],pickQ='',pickMode='ord',selOrds=new Set(),curWA=null,
F={oq:'',os:'all',cq:'',cd:'all',sq:'',sd:'all',wq:'',ws:'all',lu:'all',lt:'all'};

function clone(o){return JSON.parse(JSON.stringify(o));}
function load(){
  try{
    const r=localStorage.getItem(KEY)||localStorage.getItem('erp_corp_v4')||localStorage.getItem('erp_corp_v3');
    if(!r)return clone(DEF);
    const p=JSON.parse(r),o=clone(DEF);
    if(p.s)o.s={...o.s,...p.s};
    o.users=Array.isArray(p.users)&&p.users.length?p.users:[clone(DEF_ADMIN)];
    if(!o.users.some(u=>u.role==='admin'))o.users.unshift(clone(DEF_ADMIN));
    o.logs=Array.isArray(p.logs)?p.logs:[];
    o.cust=p.cust||[];o.sup=p.sup||[];o.prod=p.prod||[];
    o.ord=p.ord||p.inv||[];o.invs=p.invs||[];o.pay=p.pay||[];o.pur=p.pur||[];o.spay=p.spay||[];o.exp=p.exp||[];
    o.ord.forEach(ord=>{
      if(ord.multiInvId&&!ord.invId)ord.invId=ord.multiInvId;
      if(ord.invNum&&!ord.invId){
        let ex=o.invs.find(v=>v.invNum===ord.invNum);
        if(!ex){
          ex={
            id:'inv_mig_'+ord.id,invNum:ord.invNum,date:ord.date,cid:ord.cid||null,cname:ord.cname||'زبون نقدي',cph:ord.cph||'',caddr:'',
            ordIds:[ord.id],ordNums:[ord.num],
            items:(ord.items||[]).map(x=>({...x,ordNum:ord.num,ordDate:ord.date})),
            total:Number(ord.total)||0,paid:Number(ord.paid)||0,rem:Number(ord.rem)||0,
            st:ord.st||'unpaid',pm:ord.pm||'',note:ord.note||'',by:ord.by||'',ts:ord.ts||Date.now()
          };
          o.invs.push(ex);
        }
        ord.invId=ex.id;
      }
    });
    return o;
  }catch{return clone(DEF);}
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(D));}catch{toast('تعذر الحفظ المحلي','err');}}
const $=id=>document.getElementById(id),
uid=(p='id')=>p+'_'+Date.now()+'_'+Math.random().toString(36).slice(2,6),
today=()=>{const n=new Date();return new Date(n-n.getTimezoneOffset()*60000).toISOString().slice(0,10);},
nowTime=()=>{const n=new Date();return n.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});},
esc=s=>s==null?'':String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'),
rn=n=>Math.round((Number(n)||0)*100)/100,
nf=n=>new Intl.NumberFormat('en-US',{maximumFractionDigits:2}).format(Number(n)||0),
cf=n=>`<span class="num">${nf(n)}</span>${D.s.cur?` <span class="text-[.82em] opacity-80">${esc(D.s.cur)}</span>`:''}`,
cfp=n=>D.s.cur?`${nf(n)} ${D.s.cur}`:nf(n),
bName=()=>D.s.name.trim()||'النظام المحاسبي المؤسسي',
bEn=()=>D.s.nameEn.trim()||'ENTERPRISE ERP',
byId=(arr,id)=>arr.find(x=>x.id===id)||null;

let curUserId=localStorage.getItem(SESS_KEY)||'';
function curUser(){return D.users.find(u=>u.id===curUserId)||null;}
function curName(){return curUser()?.name||'الإدارة';}
function isAdmin(){return curUser()?.role==='admin';}
function unreadLogs(){return D.logs.filter(l=>!l.read).length;}

function addLog(type,msg){
  const u=curUser();
  D.logs.unshift({
    id:uid('lg'),type,by:u?u.name:'النظام',role:u?u.role:'staff',
    msg,dt:today(),tm:nowTime(),ts:Date.now(),read:isAdmin()
  });
  if(D.logs.length>250)D.logs.length=250;
}

function showAuth(){
  $('auth-screen').classList.remove('hidden');
  $('app').classList.add('hidden');
  $('mnav').classList.add('hidden');
  $('auth-name').textContent=bName();
  $('auth-logo').innerHTML=D.s.logo?`<img src="${D.s.logo}" class="w-full h-full object-contain bg-white p-1"/>`:'ERP';
  $('lg-err').classList.add('hidden');
  $('lg-p').value='';
}
function enterApp(){
  $('auth-screen').classList.add('hidden');
  $('app').classList.remove('hidden');
  $('mnav').classList.remove('hidden');
  go('dashboard');
}
function doLogin(e){
  e.preventDefault();
  const uName=$('lg-u').value.trim(),pass=$('lg-p').value.trim();
  const u=D.users.find(x=>x.name.trim()===uName&&x.pass===pass);
  if(!u){
    const err=$('lg-err');err.textContent='اسم المستخدم أو كلمة السر غير صحيحة';err.classList.remove('hidden');return;
  }
  curUserId=u.id;
  localStorage.setItem(SESS_KEY,u.id);
  if(u.role!=='admin')addLog('login',`${u.name} قام بتسجيل الدخول إلى النظام`);
  save();
  enterApp();
  toast(`أهلاً بك يا ${u.name}`);
}
function doLogout(){
  const u=curUser();
  if(u&&u.role!=='admin'){addLog('login',`${u.name} قام بتسجيل الخروج`);save();}
  curUserId='';localStorage.removeItem(SESS_KEY);
  closeM();sb(0);showAuth();
}

function waClean(ph){
  let d=String(ph||'').replace(/[^\d]/g,'');
  if(!d)return '';
  if(d.startsWith('00'))d=d.slice(2);
  else if(d.startsWith('09')&&d.length===10)d='963'+d.slice(1);
  return d;
}
function openWA(ph,msg=''){
  const n=waClean(ph),txt=msg?`?text=${encodeURIComponent(msg)}`:'';
  window.open(n?`https://wa.me/${n}${txt}`:`https://wa.me/${txt}`,'_blank');
}
function waBtn(ph,lbl='واتساب'){
  return `<button onclick="openWA('${esc(ph||'')}')" class="px-2.5 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold cursor-pointer inline-flex items-center gap-1 shadow-sm">${lbl||'واتساب'}</button>`;
}

function cStats(id){
  const c=byId(D.cust,id);if(!c)return{cnt:0,invCnt:0,sales:0,paid:0,bal:0};
  const op=Number(c.open)||0,ords=D.ord.filter(o=>o.cid===id),invs=D.invs.filter(v=>v.cid===id),pays=D.pay.filter(p=>p.cid===id);
  const sales=rn(ords.reduce((a,o)=>a+(Number(o.total)||0),0)),
  pOrd=ords.reduce((a,o)=>a+(Number(o.paid)||0),0),
  pDir=pays.reduce((a,p)=>a+(Number(p.amt)||0),0),
  paid=rn(pOrd+pDir);
  return{cnt:ords.length,invCnt:invs.length,sales,paid,bal:rn(op+sales-paid)};
}

function cLedger(id){
  const c=byId(D.cust,id);if(!c)return[];
  const L=[],op=Number(c.open)||0;
  if(op)L.push({dt:'-',k:0,ref:'رصيد سابق',desc:'رصيد افتتاحي مرحل',d:op>0?op:0,c:op<0?-op:0});
  const invoicedOrdIds=new Set();
  D.invs.filter(v=>v.cid===id).forEach(v=>{
    (v.ordIds||[]).forEach(oid=>invoicedOrdIds.add(oid));
    const ordsTxt=(v.ordNums||[]).length?` (طلبيات: ${(v.ordNums||[]).join('، ')})`:'';
    L.push({dt:v.date,k:v.ts||0,ref:v.invNum,desc:`فاتورة رقم ${v.invNum}${ordsTxt}`,d:Number(v.total)||0,c:0});
    if((Number(v.paid)||0)>0)L.push({dt:v.date,k:(v.ts||0)+1,ref:v.invNum,desc:`دفعة مع الفاتورة ${v.invNum}${v.pm?' ('+v.pm+')':''}`,d:0,c:Number(v.paid)||0});
  });
  D.ord.filter(o=>o.cid===id&&!invoicedOrdIds.has(o.id)).forEach(o=>{
    const sm=(o.items||[]).map(x=>`${x.name} (x${nf(x.qty)})`).join('، ');
    L.push({dt:o.date,k:o.ts||0,ref:o.num,desc:`طلبية قيد الفوترة ${o.num}${sm?' - '+sm:''}`,d:Number(o.total)||0,c:0});
    if((Number(o.paid)||0)>0)L.push({dt:o.date,k:(o.ts||0)+1,ref:o.num,desc:`دفعة (${o.pm||'كاش'}) مع الطلبية ${o.num}`,d:0,c:Number(o.paid)||0});
  });
  D.pay.filter(p=>p.cid===id).forEach(p=>{
    L.push({dt:p.date,k:p.ts||0,ref:p.num||'RV',desc:`إيصال قبض (${p.m||'كاش'})${p.note?' - '+p.note:''}`,d:0,c:Number(p.amt)||0});
  });
  L.sort((a,b)=>a.k-b.k);
  let r=0;return L.map(x=>{r=rn(r+x.d-x.c);return{...x,r};});
}

function sStats(id){
  const s=byId(D.sup,id);if(!s)return{cnt:0,tot:0,paid:0,bal:0};
  const op=Number(s.open)||0,purs=D.pur.filter(p=>p.sid===id),pays=D.spay.filter(p=>p.sid===id);
  const tot=rn(purs.reduce((a,p)=>a+(Number(p.total)||0),0)),
  paid=rn(pays.reduce((a,p)=>a+(Number(p.amt)||0),0));
  return{cnt:purs.length,tot,paid,bal:rn(op+tot-paid)};
}

function sLedger(id){
  const s=byId(D.sup,id);if(!s)return[];
  const L=[],op=Number(s.open)||0;
  if(op)L.push({dt:'-',k:0,ref:'رصيد سابق',desc:'رصيد افتتاحي للتاجر',cr:op>0?op:0,dr:op<0?-op:0});
  D.pur.filter(p=>p.sid===id).forEach(p=>{
    const sm=(p.items||[]).map(x=>`${x.name} (x${nf(x.qty)})`).join('، ');
    L.push({dt:p.date,k:p.ts||0,ref:p.num,desc:`عملية شراء ${p.num}${sm?' - '+sm:''}`,cr:Number(p.total)||0,dr:0});
  });
  D.spay.filter(p=>p.sid===id).forEach(p=>{
    L.push({dt:p.date,k:p.ts||0,ref:p.num||'PV',desc:`إيصال دفع ${p.num||''} (${p.m||'كاش'})${p.note?' - '+p.note:''}`,cr:0,dr:Number(p.amt)||0});
  });
  L.sort((a,b)=>a.k-b.k);
  let r=0;return L.map(x=>{r=rn(r+x.cr-x.dr);return{...x,r};});
}

function dashStats(){
  const sales=rn(D.ord.reduce((a,o)=>a+(Number(o.total)||0),0)),
  coll=rn(D.ord.reduce((a,o)=>a+(Number(o.paid)||0),0)+D.pay.reduce((a,p)=>a+(Number(p.amt)||0),0)),
  totPur=rn(D.pur.filter(p=>p.sid).reduce((a,p)=>a+(Number(p.total)||0),0)),
  paidSup=rn(D.spay.reduce((a,p)=>a+(Number(p.amt)||0),0)),
  exp=rn(D.exp.reduce((a,e)=>a+(Number(e.amt)||0),0));
  let gp=0;
  D.ord.forEach(o=>{
    const cost=(o.items||[]).reduce((a,x)=>a+(Number(x.cost)||0)*(Number(x.qty)||0),0);
    gp+=(Number(o.total)||0)-cost;
  });
  const debtors=D.cust.map(c=>({...c,...cStats(c.id)})).filter(x=>x.bal>0).sort((a,b)=>b.bal-a.bal),
  creditors=D.sup.map(s=>({...s,...sStats(s.id)})).filter(x=>x.bal>0).sort((a,b)=>b.bal-a.bal),
  wCost=rn(D.prod.reduce((a,p)=>a+Math.max(0,Number(p.qty)||0)*(Number(p.cost)||0),0)),
  wSell=rn(D.prod.reduce((a,p)=>a+Math.max(0,Number(p.qty)||0)*(Number(p.sell)||0),0)),
  low=D.prod.filter(p=>(Number(p.qty)||0)<=(Number(p.min)||0));
  return{sales,coll,totPur,paidSup,exp,profit:rn(gp-exp),cash:rn(coll-exp-paidSup),debtors,debts:rn(debtors.reduce((a,x)=>a+x.bal,0)),creditors,payables:rn(creditors.reduce((a,x)=>a+x.bal,0)),wCost,wSell,low};
}

const skBadge=p=>{const q=Number(p.qty)||0,m=Number(p.min)||0;return q<=0?['out','نافذ','bg-rose-100 text-rose-800 border-rose-300']:q<=m?['low','منخفض','bg-amber-100 text-amber-900 border-amber-300']:['ok','متوفر','bg-teal-100 text-teal-800 border-teal-300'];};

function ssMode(hide){const b=$('doc-bar');if(!b)return;b.classList.toggle('hidden',!!hide);if(hide)toast('اضغط بأي مكان لإظهار الشريط','info');requestAnimationFrame(fitDoc);}
function fitDoc(){
  const st=$('doc-stage'),sh=$('print-area'),wr=$('doc-wrap');if(!st||!sh||!wr)return;
  sh.style.transform='none';wr.style.width='auto';wr.style.height='auto';
  const aw=Math.max(180,st.clientWidth-14),ah=Math.max(180,st.clientHeight-14),nw=sh.offsetWidth,nh=sh.offsetHeight;
  if(!nw||!nh)return;
  const sc=Math.min(1.12,aw/nw,ah/nh);
  sh.style.transform=`scale(${sc})`;wr.style.width=Math.ceil(nw*sc)+'px';wr.style.height=Math.ceil(nh*sc)+'px';
}
window.addEventListener('resize',()=>{if($('doc-stage'))fitDoc();});

function rPicker(mode){

  const cntEl=$('pick-cnt');if(cntEl)cntEl.textContent=draft.length;
  if(!list.length){el.innerHTML='<div class="col-span-full text-center text-xs text-slate-400 py-3">لا توجد أصناف مطابقة</div>';return;}
  el.innerHTML=list.map(p=>{
    const stk=Number(p.qty)||0,disabled=mode==='ord'&&stk<=0,ex=draft.find(r=>r.pid===p.id),pr=mode==='ord'?p.sell:p.cost;
    return `<button type="button" ${disabled?'disabled':`onclick="pickItem('${p.id}','${mode}')"`} class="text-right p-2 rounded-xl border transition relative cursor-pointer ${disabled?'bg-slate-100 border-slate-200 opacity-50 cursor-not-allowed':ex?'bg-blue-50 border-blue-500 ring-1 ring-blue-400':'bg-white border-slate-200 hover:border-teal-500'}">
      <div class="font-bold text-xs text-slate-900 truncate pl-6">${esc(p.name)}</div>
      <div class="flex justify-between items-center text-[10px] mt-0.5">
        <span class="font-bold ${stk>0?'text-teal-700':'text-rose-600'}">متوفر: <span class="num">${nf(stk)}</span></span>
        <span class="font-black text-blue-800 num">${nf(pr)}</span>
      </div>
      <span id="pbadge-${p.id}" class="absolute top-1.5 left-1.5 text-[10px] font-black px-1.5 rounded-full num ${ex?'bg-blue-700 text-white':'hidden'}">${ex?nf(ex.qty):''}</span>
    </button>`;
  }).join('');
}

function pickItem(pid,mode){
  const p=byId(D.prod,pid);if(!p)return;
  const stk=Number(p.qty)||0,ex=draft.find(r=>r.pid===pid);
  if(ex){
    if(mode==='ord'&&ex.qty+1>stk){toast(`الكمية المتوفرة من "${p.name}" هي ${nf(stk)} فقط`,'warn');return;}
    ex.qty=rn(ex.qty+1);
  }else{
    if(mode==='ord'&&stk<=0){toast('الصنف نافذ من المستودع','err');return;}
    draft.push({rid:uid('r'),pid:p.id,qty:1,pr:Number(mode==='ord'?p.sell:p.cost)||0});
  }
  rPicker(mode);rRows(mode);mode==='ord'?calcOrd():calcPur();
}

function stepQty(rid,delta,mode){
  const r=draft.find(x=>x.rid===rid);if(!r)return;
  const p=byId(D.prod,r.pid),stk=p?Number(p.qty)||0:0,nq=rn(r.qty+delta);
  if(nq<=0){draft=draft.filter(x=>x.rid!==rid);rPicker(mode);rRows(mode);mode==='ord'?calcOrd():calcPur();return;}
  if(mode==='ord'&&nq>stk){toast(`المتوفر فقط ${nf(stk)}`,'warn');return;}
  r.qty=nq;
  const inp=$('qi-'+rid);if(inp)inp.value=r.qty;
  updRowVisual(r,mode);mode==='ord'?calcOrd():calcPur();
}

function rRows(mode){
  const el=$('rows');if(!el)return;
  const cntEl=$('pick-cnt');if(cntEl)cntEl.textContent=draft.length;
  if(!draft.length){el.innerHTML='<div class="p-4 rounded-xl border border-dashed border-slate-300 text-center text-xs text-slate-400">اضغط على الأصناف أعلاه لإضافتها هنا (يمكنك اختيار أكثر من صنف)</div>';return;}
  el.innerHTML=draft.map(r=>{
    const p=byId(D.prod,r.pid),stk=p?Number(p.qty)||0:0,over=mode==='ord'&&r.qty>stk;
    return `
    <div id="row-${r.rid}" class="grid grid-cols-12 gap-1.5 items-center bg-slate-50 p-2 rounded-xl border ${over?'border-rose-400 bg-rose-50/50':'border-slate-200'}">
      <div class="col-span-12 sm:col-span-4 min-w-0">
        <div class="font-extrabold text-xs text-slate-900 truncate">${esc(p?p.name:'صنف')}</div>
        <div id="st-${r.rid}" class="text-[10px] font-bold ${over?'text-rose-600':'text-teal-700'}">${mode==='ord'?(over?`تنبيه: المطلوب أكبر من المتوفر (${nf(stk)})`:`المتبقي بالمستودع: ${nf(stk)}`):`الحالي بالمستودع: ${nf(stk)}`}</div>
      </div>
      <div class="col-span-5 sm:col-span-3 flex items-center gap-1">
        <button type="button" onclick="stepQty('${r.rid}',-1,'${mode}')" class="w-7 h-7 rounded-lg bg-slate-200 hover:bg-slate-300 font-black text-sm shrink-0 cursor-pointer">-</button>
        <input id="qi-${r.rid}" type="number" min="0.01" step="any" value="${r.qty}" oninput="updRow('${r.rid}','qty',this.value,'${mode}')" class="w-full px-1.5 py-1 rounded-lg border bg-white text-xs text-center font-bold num"/>
        <button type="button" onclick="stepQty('${r.rid}',1,'${mode}')" class="w-7 h-7 rounded-lg bg-blue-100 hover:bg-blue-200 text-blue-800 font-black text-sm shrink-0 cursor-pointer">+</button>
      </div>
      <div class="col-span-4 sm:col-span-2"><input id="pi-${r.rid}" type="number" min="0" step="any" value="${r.pr}" oninput="updRow('${r.rid}','pr',this.value,'${mode}')" placeholder="السعر" class="w-full px-2 py-1 rounded-lg border bg-white text-xs text-center font-bold num"/></div>
      <div id="lt-${r.rid}" class="col-span-2 sm:col-span-2 text-center text-xs font-black num">${nf(r.qty*r.pr)}</div>
      <div class="col-span-1 text-left"><button type="button" onclick="draft=draft.filter(x=>x.rid!=='${r.rid}');rPicker('${mode}');rRows('${mode}');${mode==='ord'?'calcOrd()':'calcPur()'}" class="text-rose-600 font-bold px-1 cursor-pointer">X</button></div>
    </div>`;
  }).join('');
}

function updRowVisual(r,mode){
  const p=byId(D.prod,r.pid),stk=p?Number(p.qty)||0:0,over=mode==='ord'&&r.qty>stk;
  const lt=$('lt-'+r.rid);if(lt)lt.textContent=nf(r.qty*r.pr);
  const st=$('st-'+r.rid);
  if(st){st.className=`text-[10px] font-bold ${over?'text-rose-600':'text-teal-700'}`;st.textContent=mode==='ord'?(over?`تنبيه: المطلوب أكبر من المتوفر (${nf(stk)})`:`المتبقي بالمستودع: ${nf(stk)}`):`الحالي بالمستودع: ${nf(stk)}`;}
  const row=$('row-'+r.rid);
  if(row){row.classList.toggle('border-rose-400',over);row.classList.toggle('bg-rose-50/50',over);row.classList.toggle('border-slate-200',!over);}
  const pb=$('pbadge-'+r.pid);if(pb){pb.textContent=nf(r.qty);pb.classList.remove('hidden');}
}

function updRow(rid,k,v,mode){
  const r=draft.find(x=>x.rid===rid);if(!r)return;
  r[k]=Number(v)||0;updRowVisual(r,mode);mode==='ord'?calcOrd():calcPur();
}

function calcOrd(man=0){
  const tot=rn(draft.reduce((a,r)=>a+r.qty*r.pr,0)),st=$('ost'),pe=$('opd');if(!st||!pe)return;
  if(!$('oc').value&&st.value!=='paid'){toast('الدين أو الدفعة الجزئية يتطلب اختيار زبون','warn');st.value='paid';}
  let pd=Number(pe.value)||0;
  if(!man){pd=st.value==='paid'?tot:st.value==='unpaid'?0:(pd>=tot?0:pd);pe.value=pd;pe.readOnly=(st.value!=='partial');}
  else{pd=Math.max(0,Math.min(tot,pd));st.value=pd>=tot&&tot>0?'paid':pd<=0&&tot>0?'unpaid':'partial';}
  $('pm-wrap').classList.toggle('hidden',st.value==='unpaid');
  $('pd-wrap').classList.toggle('opacity-50',!man&&st.value!=='partial');
  $('otot').innerHTML=cf(tot);$('ospd').innerHTML=cf(pd);$('orem').innerHTML=cf(rn(tot-pd));
}

function createInvFromOrders(chosen,date,note=''){
  const first=chosen[0],cid=first.cid||null,c=cid?byId(D.cust,cid):null;
  const invNum=D.s.invP+D.s.nInv++,by=curName();
  const items=[];
  chosen.forEach(o=>{(o.items||[]).forEach(x=>items.push({...x,ordNum:o.num,ordDate:o.date}));});
  const tot=rn(chosen.reduce((a,o)=>a+(Number(o.total)||0),0)),
  pd=rn(chosen.reduce((a,o)=>a+(Number(o.paid)||0),0)),
  rm=rn(chosen.reduce((a,o)=>a+(Number(o.rem)||0),0));
  const pms=[...new Set(chosen.map(o=>o.pm).filter(Boolean))];
  const inv={
    id:uid('inv'),invNum,date:date||today(),cid,cname:c?c.name:(first.cname||'زبون نقدي'),cph:c?.phone||first.cph||'',caddr:c?.addr||'',
    ordIds:chosen.map(o=>o.id),ordNums:chosen.map(o=>o.num),items,total:tot,paid:pd,rem:rm,
    st:rm<=0?'paid':pd>0?'partial':'unpaid',pm:pms.length===1?pms[0]:'',note:note||(chosen.length===1?(first.note||''):''),by,ts:Date.now()
  };
  D.invs.push(inv);
  chosen.forEach(o=>{o.invId=inv.id;o.invNum=invNum;});
  addLog('inv',`${by} أصدر فاتورة رقم ${invNum} للزبون «${inv.cname}» بقيمة ${cfp(tot)} (${chosen.length} طلبيات)`);
  return inv;
}

function saveOrd(e){
  e.preventDefault();
  if(!draft.length){toast('اختر صنفاً واحداً على الأقل من المستودع','err');return;}
  const cid=$('oc').value||null,dt=$('od').value||today(),stVal=$('ost').value,pm=stVal==='unpaid'?'':$('opm').value;
  const req={},items=[];
  for(const r of draft){
    const p=byId(D.prod,r.pid);
    if(!p||r.qty<=0){toast('تحقق من الأصناف والكميات','err');return;}
    req[p.id]=(req[p.id]||0)+r.qty;
    items.push({pid:p.id,name:p.name,qty:r.qty,pr:r.pr,cost:Number(p.cost)||0,tot:rn(r.qty*r.pr)});
  }
  for(const[pid,need]of Object.entries(req)){const p=byId(D.prod,pid);if(p&&(Number(p.qty)||0)<need){toast(`المتوفر من "${p.name}" هو ${nf(p.qty)} فقط`,'err');return;}}
  const tot=rn(items.reduce((a,x)=>a+x.tot,0)),pd=stVal==='paid'?tot:stVal==='unpaid'?0:Math.max(0,Math.min(tot,Number($('opd').value)||0)),rem=rn(tot-pd);
  if(rem>0&&!cid){toast('اختر زبوناً للطلبية الآجلة','err');return;}
  for(const[pid,need]of Object.entries(req)){const p=byId(D.prod,pid);if(p)p.qty=rn((Number(p.qty)||0)-need);}
  const c=cid?byId(D.cust,cid):null,num=D.s.ordP+D.s.nOrd++,auto=$('oauto').checked,by=curName();
  const ord={id:uid('ord'),num,invId:null,invNum:null,date:dt,cid,cname:c?c.name:'زبون نقدي',cph:c?.phone||'',items,total:tot,paid:pd,rem,st:rem<=0?'paid':pd>0?'partial':'unpaid',pm,note:$('onote').value.trim(),by,ts:Date.now()};
  D.ord.push(ord);

  let inv=null;

  const q=F.cq.trim().toLowerCase(),list=D.cust.map(c=>({...c,st:cStats(c.id)})).filter(c=>{
    if(F.cd==='debt'&&c.st.bal<=0)return false;
    if(F.cd==='ok'&&c.st.bal>0)return false;
    return !q||(c.name||'').toLowerCase().includes(q)||(c.phone||'').toLowerCase().includes(q);
  });
  if(!list.length){el.innerHTML='<div class="card rounded-2xl p-10 text-center text-slate-400 text-sm">لا يوجد زبائن</div>';return;}
  el.innerHTML=`<div class="space-y-2.5">${list.map(c=>`
    <div onclick="openCust('${c.id}')" class="card rounded-2xl p-3.5 border-r-4 border-sky-600 flex flex-col sm:flex-row sm:items-center justify-between gap-3 cursor-pointer hover:bg-sky-50/40 transition">
      <div><div class="font-extrabold text-slate-900">${esc(c.name)}</div><div class="text-xs text-slate-500 num">${esc(c.phone||'بدون هاتف')} • ${c.st.invCnt} فواتير • ${c.st.cnt} طلبيات</div></div>
      <div class="flex flex-wrap items-center justify-between sm:justify-end gap-2" onclick="event.stopPropagation()">
        <div class="text-left ml-2"><div class="text-[10px] text-slate-400">الديون</div><div class="font-black text-sm ${c.st.bal>0?'text-rose-600':'text-emerald-600'}">${cf(c.st.bal)}</div></div>
        ${waBtn(c.phone,'واتساب')}
        <button onclick="prevCStmt('${c.id}')" class="px-2.5 py-1.5 rounded-lg bg-cyan-700 text-white text-xs font-bold cursor-pointer">كشف حساب</button>
        <button onclick="openCustModal('${c.id}')" class="px-2.5 py-1.5 rounded-lg bg-slate-100 text-slate-700 text-xs font-bold cursor-pointer">تعديل</button>
      </div>
    </div>`).join('')}</div>`;
}

function openCustModal(id=''){
  const c=id?byId(D.cust,id):null;
  modal(`<div class="p-4 border-b flex justify-between bg-sky-700 text-white"><h3 class="font-extrabold">${c?'تعديل زبون':'إضافة زبون جديد'}</h3><button onclick="closeM()" class="font-bold cursor-pointer">X</button></div>
    <form onsubmit="saveCust(event,'${id}')" class="p-4 space-y-3">
      <input id="cn" required value="${esc(c?.name||'')}" placeholder="اسم الزبون *" class="w-full px-3 py-2 rounded-xl border text-sm"/>
      <div class="grid grid-cols-2 gap-2.5"><input id="cp" value="${esc(c?.phone||'')}" placeholder="رقم الواتساب / الهاتف" class="px-3 py-2 rounded-xl border text-sm num"/><input id="co" type="number" step="any" value="${c?Number(c.open)||0:0}" placeholder="رصيد سابق" class="px-3 py-2 rounded-xl border text-sm num"/></div>
      <input id="ca" value="${esc(c?.addr||'')}" placeholder="العنوان" class="w-full px-3 py-2 rounded-xl border text-sm"/>
      <div class="flex justify-end gap-2 pt-2"><button type="button" onclick="closeM()" class="px-4 py-2 rounded-xl border text-sm font-bold cursor-pointer">إلغاء</button><button class="px-5 py-2 rounded-xl bg-sky-700 text-white text-sm font-bold cursor-pointer">حفظ</button></div>

function saveCust(e,id){
  e.preventDefault();
  const obj={name:$('cn').value.trim(),phone:$('cp').value.trim(),addr:$('ca').value.trim(),open:Number($('co').value)||0};
  if(!obj.name)return;
  if(id){const i=D.cust.findIndex(x=>x.id===id);if(i>-1)D.cust[i]={...D.cust[i],...obj};}
  else{D.cust.push({id:uid('c'),...obj,by:curName(),ts:Date.now()});addLog('info',`${curName()} أضاف زبوناً جديداً: «${obj.name}»`);}
  save();closeM();render();toast('تم حفظ الزبون');
}

        <div class="col-span-7 grid grid-cols-3 gap-1.5 text-center">

function openPayModal(preC=''){
  if(!D.cust.length){toast('أضف زبوناً أولاً','warn');return;}
  const cid=preC||D.cust[0].id,bal=Math.max(0,cStats(cid).bal);
  modal(`<div class="p-4 border-b flex justify-between bg-emerald-700 text-white"><h3 class="font-extrabold">إيصال قبض (<span class="num">${esc(D.s.rvP+D.s.nRv)}</span>)</h3><button onclick="closeM()" class="font-bold cursor-pointer">X</button></div>
    <form onsubmit="savePay(event)" class="p-4 space-y-3">
      <select id="pc" onchange="const b=Math.max(0,cStats(this.value).bal);$('pa').value=b||'';$('ph').textContent='المتبقي: '+cfp(b)" class="w-full px-3 py-2 rounded-xl border text-sm">${D.cust.map(c=>`<option value="${c.id}" ${c.id===cid?'selected':''}>${esc(c.name)} (${nf(cStats(c.id).bal)})</option>`).join('')}</select>

      <div class="grid grid-cols-2 gap-2.5"><input id="pa" type="number" min="0.01" step="any" required value="${bal||''}" placeholder="المبلغ *" class="px-3 py-2 rounded-xl border text-sm font-bold text-emerald-700 num"/><input id="pd" type="date" value="${today()}" required class="px-3 py-2 rounded-xl border text-sm num"/></div>
      <select id="pm" class="w-full px-3 py-2 rounded-xl border text-sm font-bold text-emerald-800">${PAYM.map(m=>`<option>${m}</option>`).join('')}</select>
      <input id="pn" placeholder="ملاحظة / البيان..." class="w-full px-3 py-2 rounded-xl border text-sm"/>
      <div class="flex justify-end gap-2 pt-2"><button type="button" onclick="closeM()" class="px-4 py-2 rounded-xl border text-sm font-bold cursor-pointer">إلغاء</button><button class="px-5 py-2 rounded-xl bg-emerald-700 text-white text-sm font-bold cursor-pointer">خصم وإصدار الإيصال</button></div>
    </form>`);
}
function savePay(e){
  e.preventDefault();
  const cid=$('pc').value,amt=Number($('pa').value)||0;if(!cid||amt<=0)return;
  const num=D.s.rvP+D.s.nRv++,cname=byId(D.cust,cid)?.name||'',by=curName();
  const p={id:uid('rv'),num,cid,cname,amt,date:$('pd').value||today(),m:$('pm').value,note:$('pn').value.trim(),by,ts:Date.now()};
  D.pay.push(p);
  addLog('pay',`${by} قبض مبلغ ${cfp(amt)} (${p.m}) من الزبون «${cname}» - إيصال ${num}`);

function calcPur(){

  if($('ptot'))$('ptot').innerHTML=cf(tot);if($('pspd'))$('pspd').innerHTML=cf(pd);if($('prem'))$('prem').innerHTML=cf(hasSup?rn(tot-pd):0);
}
function savePur(e){
  e.preventDefault();
  if(!draft.length){toast('اختر صنفاً واحداً على الأقل للاستلام','err');return;}
  const sid=$('ps').value||null,sup=sid?byId(D.sup,sid):null,dt=$('pdt').value||today(),by=curName();
  const items=[];
  for(const r of draft){
    const p=byId(D.prod,r.pid);if(!p||r.qty<=0){toast('تحقق من الأصناف والكميات','err');return;}
    items.push({pid:p.id,name:p.name,qty:r.qty,pr:r.pr,tot:rn(r.qty*r.pr)});
    p.qty=rn((Number(p.qty)||0)+r.qty);if(r.pr>0)p.cost=r.pr;
  }
  const tot=rn(items.reduce((a,x)=>a+x.tot,0)),pd=sup?Math.max(0,Math.min(tot,Number($('ppd').value)||0)):0,num=D.s.purP+D.s.nPur++;

  addLog('pur',`${by} استلم بضاعة (${num}) من «${sname}» بقيمة ${cfp(tot)}`);

    const mv=[];

function saveProd(e,id){
  e.preventDefault();
  const obj={name:$('pn1').value.trim(),cost:Number($('pc1').value)||0,sell:Number($('ps1').value)||0,min:Number($('pm1').value)||0};
  if(!obj.name)return;
  if(id){const i=D.prod.findIndex(x=>x.id===id);if(i>-1)D.prod[i]={...D.prod[i],...obj};}
  else{D.prod.push({id:uid('pr'),...obj,qty:0,by:curName(),ts:Date.now()});addLog('info',`${curName()} أضاف صنفاً للمستودع: «${obj.name}»`);}
  save();closeM();render();toast(id?'تم تحديث بيانات الصنف':'تمت إضافة الصنف - اضغط «+ استلام بضاعة» لإدخال كميته');
}
function delProd(id){confirmM('حذف الصنف','هل أنت متأكد؟',()=>{const p=byId(D.prod,id);D.prod=D.prod.filter(x=>x.id!==id);if(p)addLog('del',`${curName()} حذف الصنف «${p.name}» من المستودع`);save();render();toast('تم الحذف');});}

function openExpModal(){
  modal(`<div class="p-4 border-b flex justify-between bg-rose-700 text-white"><h3 class="font-extrabold">تسجيل مصروف</h3><button onclick="closeM()" class="font-bold cursor-pointer">X</button></div>

function saveExp(e){
  e.preventDefault();
  const title=$('et').value.trim(),amt=Number($('ea').value)||0,by=curName();
  D.exp.push({id:uid('ex'),title,cat:$('ec').value,amt,date:$('ed').value||today(),note:$('en').value.trim(),by,ts:Date.now()});
  addLog('exp',`${by} سجل مصروف «${title}» بقيمة ${cfp(amt)}`);
  save();closeM();render();toast('تم تسجيل المصروف');
}
function delExp(id){
  const e=byId(D.exp,id);if(!e)return;
  confirmM('حذف المصروف','هل أنت متأكد؟',()=>{
    D.exp=D.exp.filter(x=>x.id!==id);
    addLog('del',`${curName()} حذف مصروف «${e.title}» بقيمة ${cfp(e.amt)}`);
    save();render();toast('تم الحذف');
  });
}
